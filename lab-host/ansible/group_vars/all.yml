---
# Host-specific values and every version pin, in one place. Role defaults hold
# behaviour knobs only; anything that names a version, digest or checksum is
# here so a bump is one edit and one diff.

lab_host_domain: lab.hybridcloudworks.com

# The Ubuntu releases this playbook runs on, codename to version. 26.04 LTS is
# the target: the VPS was reinstalled with it and stays on it (owner decision
# 2026-09-26). 24.04 LTS is still accepted so the roles keep working on the
# release they were first written for, but nothing waits on it. site.yml
# refuses any other release, and every per-release map below (docker, arc)
# has one entry per codename listed here. bootstrap.sh checks the same two
# versions before Ansible exists, so a change here is a change there too.
lab_host_ubuntu_releases:
  resolute: "26.04"
  noble: "24.04"

# Hardening. SSH and the two web ports are the only inbound ports: vps-agent is
# pull-based and node_exporter listens on loopback. The admin user's keys
# default to whatever the provisioner installed for root, so the first run
# never locks the host; set the list to pin them explicitly.
hardening_ufw_allowed_tcp_ports:
  - 22
  - 80
  - 443
hardening_admin_user: hcwadmin
hardening_admin_authorized_keys: []
hardening_unattended_reboot_time: "04:30"

# Azure Arc (#663, ADR 0032 decision 3). Off until the owner has created the
# onboarding service principal, applied its grant in hcw-azure and put its
# credential in the vault (docs/runbooks/labs-host.md). The agent comes from
# Microsoft's repository for the running release,
# packages.microsoft.com/ubuntu/<version>/prod. 1.68.03532.1399 is the newest
# azcmagent in both the 26.04 and the 24.04 repository (read 2026-09-26), so
# it is one pin. The two repositories are signed by DIFFERENT keys:
# packages.microsoft.com signs repositories created since spring 2025 with
# microsoft-2025.asc (fingerprint AA86F75E427A19DD33346403EE4D7792F748182B)
# and older ones with microsoft.asc (BC528686B50D79E339D3721CEB3E94ADBE1229CF),
# per https://packages.microsoft.com/keys/README. The 26.04 repository is the
# new kind, and microsoft.asc cannot verify its InRelease at all. So the key's
# SHA256 is pinned per release: the sha256sum of the key the role fetches for
# that release (arc_apt_key_urls in the role defaults), each read 2026-09-26
# and checked with gpgv against that release's dists/<codename>/InRelease.
# get_url refuses a key that does not match. The resource name is fixed rather
# than left to the hostname default because it cannot change without a
# disconnect, and the runbook's az commands name it. The tags mirror infra/'s
# var.tags with managedBy naming what actually creates the resource.
arc_enabled: false
arc_agent_version: "1.68.03532.1399"
arc_apt_key_checksums:
  resolute: sha256:d45224d594d969f084232deaaf97c58ca502a9d964c362d7aaef5a76e16b3dd1
  noble: sha256:2fa9c05d591a1582a9aba276272478c262e95ad00acf60eaee1644d93941e3c6
arc_apt_key_checksum: "{{ arc_apt_key_checksums[ansible_facts['distribution_release']] }}"
arc_resource_group: rg-lab-hybrid-prod-cus
arc_location: centralus
arc_resource_name: arcs-lab-hybrid-prod-cus-01
arc_tags:
  workload: hybridcloudworks
  environment: prod
  owner: platform
  costCenter: content-platform
  managedBy: ansible
  criticality: high
  dataClassification: internal

# Docker Engine from download.docker.com. Docker builds every package once per
# Ubuntu release and puts the release in the version string
# (5:29.8.1-1~ubuntu.26.04~resolute), so the pins are a map keyed by codename
# and the four role inputs below read the running release's entry. Each string
# is the newest that package had in dists/<codename>/stable/binary-amd64/Packages
# on 2026-09-26; the upstream versions are the same for both releases. buildx and
# compose are pinned too rather than left as recommends: Coder and its
# PostgreSQL (#679) are the Docker Compose services ADR 0032 names. The signing
# key is the root of trust for every one of these pins, so its SHA256 is pinned
# as well (sha256sum of https://download.docker.com/linux/ubuntu/gpg, read
# 2026-09-26; one key signs both releases' InRelease, checked with gpgv) and
# get_url refuses a key that does not match.
docker_release_pins:
  resolute:
    engine: "5:29.8.1-1~ubuntu.26.04~resolute"
    containerd: "2.3.6-1~ubuntu.26.04~resolute"
    buildx: "0.37.1-1~ubuntu.26.04~resolute"
    compose: "5.5.1-1~ubuntu.26.04~resolute"
  noble:
    engine: "5:29.8.1-1~ubuntu.24.04~noble"
    containerd: "2.3.6-1~ubuntu.24.04~noble"
    buildx: "0.37.1-1~ubuntu.24.04~noble"
    compose: "5.5.1-1~ubuntu.24.04~noble"
docker_version: "{{ docker_release_pins[ansible_facts['distribution_release']].engine }}"
docker_containerd_version: "{{ docker_release_pins[ansible_facts['distribution_release']].containerd }}"
docker_buildx_version: "{{ docker_release_pins[ansible_facts['distribution_release']].buildx }}"
docker_compose_version: "{{ docker_release_pins[ansible_facts['distribution_release']].compose }}"
docker_apt_key_checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570

# Caddy is host-native (ADR 0032) and built with xcaddy inside the official
# builder image, because the caddyserver.com download API always builds the
# latest release and ignores a version parameter (verified 2026-09-25). These
# lines are the build's provenance. caddy_builder_image_digest is the image
# INDEX of caddy:2.11.4-builder from `docker buildx imagetools inspect` (its
# linux/amd64 manifest beneath is sha256:7a05631b...). The role pulls and runs
# caddy@<digest>, never the tag: Docker verifies the content against the digest
# on pull, so a bumped pin is simply a new reference that gets pulled. The tag
# is recorded for humans reading this file. The first twelve hex characters of
# the digest are part of the built binary's filename, so bumping the builder
# rebuilds.
caddy_version: v2.11.4
caddy_cloudflare_module_version: v0.2.4
caddy_builder_image: caddy
caddy_builder_image_tag: 2.11.4-builder
caddy_builder_image_digest: sha256:401121e61853cb9c7df83cba43e532e49a68e30f32921c7bdcb7a4912168c067
caddy_site_domain: "{{ lab_host_domain }}"
# The three names ADR 0032 puts on the certificate. DNS-01 for each is answered
# through the CNAME delegation of _acme-challenge.lab and _acme-challenge.coder.lab
# to the dedicated lab zone (#661).
caddy_site_names:
  - "{{ lab_host_domain }}"
  - "*.{{ lab_host_domain }}"
  - "*.coder.{{ lab_host_domain }}"

# Coder (#679) is the learner identity boundary and signs learners in with
# GitHub OAuth. The coder role renders coder_oauth2_github_allowed_orgs into
# CODER_OAUTH2_GITHUB_ALLOWED_ORGS. An EMPTY list is not a lock: Coder reads it
# as "no organisation restriction" and lets ANY GitHub account sign in, so
# site.yml and the role both refuse to run with coder_enabled true and this
# list empty. Set the organisation(s) whose members are allowed before
# flipping coder_enabled. The kill switches are
# coder_oauth2_github_allow_signups: false (no new learners; existing ones keep
# working) or stopping the coder compose service (everyone), never an emptied
# allowlist. Enabling also needs three vault keys (lab-host/README.md, "Coder").
coder_enabled: false
coder_oauth2_github_allowed_orgs: []
coder_oauth2_github_allow_signups: true
coder_domain: "coder.{{ lab_host_domain }}"
# Concurrent workspaces the host is sized for. Coder Community enforces no
# count; the role asserts 5 x 2 GiB (the template's limit) + 2.5 GiB for
# Coder, PostgreSQL and the OS fits the host's memory (12.5 of KVM 4's 16 GB),
# and the site's status card (#680) publishes it as capacity.
coder_max_workspaces: 5
# Image INDEX digests from `docker buildx imagetools inspect`, read 2026-09-25;
# the role runs image@digest and the tags are for humans. coder:latest and
# v2.37.3 resolved to the same digest that day; postgres:16 and 16.15 likewise.
coder_image: ghcr.io/coder/coder
coder_image_tag: v2.37.3
coder_image_digest: sha256:a48f82c2c437e032ce3f6970b4e937a7900cad3c76956956955099465b45e542
coder_postgres_image: postgres
coder_postgres_image_tag: "16.15"
coder_postgres_image_digest: sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54

# vps-agent runs host-native as a systemd service (ADR 0032) from a checkout of
# this repository at a pinned commit. The repository has no tagged release, so
# the pin is a sha.
labs_agent_user: hcw-labs-agent
labs_agent_home: /opt/hcw-labs-agent
labs_agent_repo_url: https://github.com/HybridCloudWorks/HCW-HybridCloudWorks.git
labs_agent_repo_ref: 04aa9e36a2c16813dcbabb838f5c2b86d3370d96
# Node.js 26, the newest release line (owner direction 2026-09-26; it becomes
# LTS on 2026-10-28). NodeSource publishes one codename-independent suite,
# nodistro, so this pin is the same on 26.04 and 24.04; 26.10.0-1nodesource1
# is the newest nodejs in node_26.x/dists/nodistro/main/binary-amd64/Packages,
# read 2026-09-26. The line itself is labs_agent_node_apt_repository_url in
# the role defaults, so a major bump moves both.
labs_agent_node_version: "26.10.0-1nodesource1"
# sha256sum of https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key, read
# 2026-09-26 and checked with gpgv against node_26.x/dists/nodistro/InRelease;
# the key that apt trusts for the pinned nodejs package.
labs_agent_node_apt_key_checksum: sha256:b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d
labs_agent_id: vps-hostinger-01

# node_exporter release tarball, linux-amd64, from the release's sha256sums.txt.
node_exporter_version: 1.12.1
node_exporter_checksum: sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
