---
- name: Install the hardening packages
  ansible.builtin.apt:
    name: "{{ hardening_packages }}"
    state: present

- name: Create the administrative user
  ansible.builtin.user:
    name: "{{ hardening_admin_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Check for keys the provisioner installed for root
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
  register: hardening_root_keys_stat

- name: Read the keys the provisioner installed for root
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: hardening_root_keys
  when:
    - hardening_admin_authorized_keys | length == 0
    - hardening_root_keys_stat.stat.exists

- name: Decide which public keys the administrative user gets
  ansible.builtin.set_fact:
    hardening_effective_authorized_keys: >-
      {{ hardening_admin_authorized_keys
         if hardening_admin_authorized_keys | length > 0
         else hardening_root_keys.content | default('') | b64decode
              | split('\n') | map('trim') | select('match', '^(ssh-|ecdsa-|sk-)') | list }}

- name: Refuse to disable password login without a key for the administrative user
  ansible.builtin.assert:
    that:
      - hardening_effective_authorized_keys | length > 0
    fail_msg: >-
      No public key for {{ hardening_admin_user }}. Set hardening_admin_authorized_keys
      or install a key in /root/.ssh/authorized_keys before running this role;
      otherwise PasswordAuthentication no and PermitRootLogin no lock everyone out.

- name: Install the administrative user's public keys
  ansible.posix.authorized_key:
    user: "{{ hardening_admin_user }}"
    key: "{{ hardening_effective_authorized_keys | join('\n') }}"
    exclusive: true
    state: present

- name: Let the administrative user sudo without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-hcw-admin
    content: "{{ hardening_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Harden sshd through a drop-in that sorts before cloud-init's
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hcw-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Default to denying inbound traffic
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default to allowing outbound traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow the inbound TCP ports the host serves
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ item }}"
  loop: "{{ hardening_ufw_allowed_tcp_ports }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    logging: "{{ hardening_ufw_logging }}"

- name: Turn on periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Reboot automatically at a fixed hour when an upgrade needs it
  ansible.builtin.template:
    src: 52hcw-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52hcw-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  notify: Restart unattended-upgrades

- name: Enable the apt timers and the unattended-upgrades service
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - unattended-upgrades.service

- name: Configure the fail2ban sshd jail
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/hcw-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
