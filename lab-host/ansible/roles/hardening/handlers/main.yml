---
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
