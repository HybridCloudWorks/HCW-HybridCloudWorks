---
# arc_enabled, arc_agent_version, arc_apt_key_checksum, arc_resource_group,
# arc_location, arc_resource_name and arc_tags are the switch, the pins and the
# machine's Azure identity; they live in group_vars/all.yml and
# meta/argument_specs.yml marks them required.

# Microsoft's package repository for Ubuntu 24.04. The same key signs the
# repository's InRelease; its checksum is pinned in group_vars.
arc_apt_key_url: https://packages.microsoft.com/keys/microsoft.asc
arc_apt_key_path: /etc/apt/keyrings/microsoft.asc
arc_apt_repository_url: https://packages.microsoft.com/ubuntu/24.04/prod

# Where the package installs the CLI on Linux.
arc_azcmagent_path: /opt/azcmagent/bin/azcmagent

arc_cloud: AzureCloud

# Onboarding identity and target, from the vault file bootstrap.sh passes with
# -e. All four must be set when arc_enabled is true and the agent is not yet
# Connected; the role fails closed otherwise. Once it is Connected they are
# not needed, and the runbook deletes the secret. The service principal holds
# only Azure Connected Machine Onboarding on arc_resource_group
# (infra/lab-hybrid.tf). The tenant and subscription are identifiers rather
# than secrets, but they are kept in the vault beside the credential because
# nothing else in this repository commits them.
arc_service_principal_id: "{{ vault_arc_service_principal_id | default('') }}"
arc_service_principal_secret: "{{ vault_arc_service_principal_secret | default('') }}"
arc_tenant_id: "{{ vault_arc_tenant_id | default('') }}"
arc_subscription_id: "{{ vault_arc_subscription_id | default('') }}"
