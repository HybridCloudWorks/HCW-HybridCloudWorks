---
# Derived names. Not meant to be overridden, which is why they are vars and not
# defaults.
# Pulled and run by digest, never by tag: Docker verifies the content against
# the digest on pull, so a bumped pin is a new reference that gets pulled and a
# moved tag is irrelevant.
caddy_builder_image_ref: "{{ caddy_builder_image }}@{{ caddy_builder_image_digest }}"
# The artifact's identity is everything that went into it: Caddy, the module
# and the builder image. A bump to any of the three changes the name, so the
# `creates` guard rebuilds instead of keeping a binary from the old inputs.
caddy_built_binary_name: >-
  caddy-{{ caddy_version }}-cloudflare-{{ caddy_cloudflare_module_version }}-{{ (caddy_builder_image_digest | replace('sha256:', ''))[:12] }}
caddy_built_binary: "{{ caddy_build_dir }}/{{ caddy_built_binary_name }}"
caddy_tls_enabled: "{{ caddy_cloudflare_api_token | length > 0 }}"
