---
# Derived values. Not meant to be overridden, which is why they are vars and
# not defaults.
labs_agent_configured: >-
  {{ labs_agent_api_base | length > 0
     and labs_agent_tenant_id | length > 0
     and labs_agent_client_id | length > 0
     and labs_agent_api_scope | length > 0 }}
# Keyed on the commit the checkout task actually landed on (its registered
# `after`, always a full sha) rather than on labs_agent_repo_ref as written, so
# a ref naming a moving target (a branch, a tag) still reinstalls when the
# commit under it moves. For a sha ref the two are equal, so the stamp name is
# the one earlier runs wrote. The Node.js pin is part of it, so moving Node
# (22 to 26 on 2026-09-26) re-runs npm ci on the new runtime and npm. Hashed
# because it becomes a file name.
labs_agent_deps_stamp: "{{ labs_agent_state_dir }}/deps-installed-{{ (labs_agent_checkout.after ~ ' ' ~ labs_agent_node_version) | hash('sha256') }}"
labs_agent_certificate_warn_seconds: "{{ labs_agent_certificate_warn_days | int * 86400 }}"
