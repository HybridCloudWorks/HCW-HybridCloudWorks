---
# Derived values. Not meant to be overridden, which is why they are vars and
# not defaults.
#
# Both are paths in the playbook's own checkout, read where the modules run.
# That is the same place: the play runs against localhost with a local
# connection (inventory/localhost.yml), which is the only way bootstrap.sh
# runs it, and tasks/main.yml refuses any other connection before using them.
lab_images_helper: "{{ role_path }}/files/lab-images.mjs"
lab_images_playbook_checkout: "{{ role_path | dirname | dirname | dirname | dirname }}"
# One plan per daemon (LAB-5, 2026-10-07): the host daemon runs the jobs and
# holds the capability images; the coder_sandbox daemon runs the workspaces
# and holds the workspace image. Each plan's pins are that daemon's only.
lab_images_host_plan_argv: >-
  {{ [lab_images_node, lab_images_helper, '--scope', 'jobs'] + lab_images_checkouts }}
lab_images_sandbox_plan_argv: >-
  {{ [lab_images_node, lab_images_helper, '--scope', 'workspaces'] + lab_images_checkouts }}
