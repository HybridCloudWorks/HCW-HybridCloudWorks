---
argument_specs:
  main:
    short_description: Hold every digest-pinned lab image on the host and remove the ones no pin names
    description:
      - Reads the pins from checkouts of this repository with files/lab-images.mjs, which imports
        IMAGES from vps-agent/lib/capabilities.js and reads the workspace image from
        lab-host/coder/templates/hcw-lab/main.tf, so a pin bump needs no edit here.
      - Pulls each capability image (and the workspace image while lab_images_pull_workspace is
        true) by repository@digest with community.docker.docker_image_pull, pull not_present, so a
        digest already on the host is ok.
      - Removes, with docker image rm, every reference in the lab's own repositories (those the
        pins name, and ghcr.io/hybridcloudworks/hcw-lab*) on an image none of whose references is
        a pin, unless a container still uses the image. No other repository is touched.
      - Runs only over a local connection, because the helper and the playbook's checkout are read
        from the machine the play runs from.
    author: HybridCloudWorks
    options:
      lab_images_checkouts:
        type: list
        elements: path
        required: false
        description:
          - Checkouts of this repository whose pins the host holds; the union is pulled and kept.
            Defaults to the playbook's own checkout and labs_agent_home, the agent's, which are
            the same commit unless -e labs_agent_repo_ref holds the agent back.
      lab_images_pull_workspace:
        type: bool
        required: false
        description:
          - Pull the Coder workspace image too. Defaults to coder_enabled. The pinned workspace
            image is kept once present either way.
      lab_images_node:
        type: path
        required: false
        default: /usr/bin/node
        description: The node binary that runs the plan; the labs_agent role installs it.
