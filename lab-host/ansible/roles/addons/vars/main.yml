---
# Derived values. Not meant to be overridden, which is why they are vars and
# not defaults.
# The host's loopback and nothing else. Docker writes its own iptables rules
# for a published port, ahead of ufw's, so ufw would not stop a publish on
# 0.0.0.0: the address here is the only thing between the internet and a
# container that is meant to be reached through Caddy alone. tasks/main.yml
# asserts it.
addons_publish_address: 127.0.0.1
# The port every add-on image listens on inside its container (PORT=8080 in
# each image); the host port is the row's `port`.
addons_container_port: 8080
# The rows the role acts on this run: every row while addons_enabled is true,
# none otherwise (then every row is removed).
addons_active: "{{ addons if addons_enabled | bool else [] }}"
addons_running: "{{ addons_active | selectattr('enabled', 'defined') | selectattr('enabled') | list }}"
# The rows that actually run: enabled, with a digest. A row that is enabled
# but has no digest yet is pending: nothing is pulled or run for it, its name
# answers 503, and any container left from an earlier digest is removed.
addons_deployed: "{{ addons_running | selectattr('image_digest') | list }}"
