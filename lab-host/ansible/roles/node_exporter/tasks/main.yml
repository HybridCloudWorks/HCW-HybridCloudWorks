---
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present

- name: Create the release directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned release and verify its checksum
  ansible.builtin.get_url:
    url: "{{ node_exporter_release_url }}"
    dest: "{{ node_exporter_install_dir }}/{{ node_exporter_release_name }}.tar.gz"
    checksum: "{{ node_exporter_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Unpack the release
  ansible.builtin.unarchive:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release_name }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    creates: "{{ node_exporter_install_dir }}/{{ node_exporter_release_name }}/node_exporter"

- name: Install the binary
  ansible.builtin.copy:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release_name }}/node_exporter"
    dest: "{{ node_exporter_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
