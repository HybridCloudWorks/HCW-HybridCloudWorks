---
- name: Bootstrap the HCW lab host
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    # The per-release pins in group_vars/all.yml are keyed by codename, so
    # both the codename and the version it belongs to are checked: a release
    # that is not in lab_host_ubuntu_releases would otherwise fail later as
    # an undefined dictionary key in the middle of a role.
    - name: Refuse to run on anything but Ubuntu 26.04 LTS or 24.04 LTS
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - lab_host_ubuntu_releases.get(ansible_facts['distribution_release']) == ansible_facts['distribution_version']
        fail_msg: >-
          This playbook is written for Ubuntu 26.04 LTS (and still accepts 24.04 LTS) and found
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['distribution_release'] }}).
        quiet: true

    - name: Note that this host runs the accepted fallback release, not the target
      ansible.builtin.debug:
        msg: >-
          Ubuntu {{ ansible_facts['distribution_version'] }} is accepted, but the lab host's
          target is 26.04 LTS (ADR 0032). The roles converge here with the noble pins.
      when: ansible_facts['distribution_release'] != 'resolute'

    - name: Refuse to enable Coder with an empty GitHub organisation allowlist
      ansible.builtin.assert:
        that:
          - coder_oauth2_github_allowed_orgs | length > 0
        fail_msg: >-
          coder_enabled is true but coder_oauth2_github_allowed_orgs is empty. An empty
          CODER_OAUTH2_GITHUB_ALLOWED_ORGS lets any GitHub account sign in; set the
          organisation(s) whose members are allowed before enabling Coder.
      when: coder_enabled | bool

    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: hardening
    # Straight after hardening: the Arc agent is a host service that needs
    # nothing the later roles install, so the host shows up in Azure even
    # when a later role fails. It does nothing while arc_enabled is false.
    - role: arc
    - role: docker
    - role: node_exporter
    - role: caddy
    - role: coder
    - role: labs_agent
    # The owner's tools, last: nothing above needs either, so a failure here
    # leaves the lab services configured. Both are off until the owner turns
    # them on, and both listen on the loopback only (ADR 0032, amendment of
    # 2026-09-26).
    - role: portainer
    - role: vault
