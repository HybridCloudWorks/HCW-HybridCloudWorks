# Ansible configuration for the lab host bootstrap. Read only when
# ansible-playbook runs from this directory, which is what bootstrap.sh does.
[defaults]
inventory = inventory/localhost.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True
forks = 5
stdout_callback = ansible.builtin.default

[callback_default]
result_format = yaml
pretty_results = True

[privilege_escalation]
become = True
become_method = ansible.builtin.sudo
