# Cloudflare Worker configuration for the reachability probe (ADR 0024, T-519).
#
# Deployed with `wrangler deploy` by whoever holds the Cloudflare account —
# nothing in CI deploys this, deliberately: the account credential lives with
# the owner, like every other Cloudflare change in this estate (REVIEW.md).
#
# The one secret is set once, out of band:
#   wrangler secret put APPLICATIONINSIGHTS_CONNECTION_STRING
# with the connection string of appi-site-prod-cus (Azure portal → the
# Application Insights resource → Connection String). It is a write-only
# ingestion credential: it can submit telemetry and nothing else.

name = "hcw-availability-probe"
main = "worker.js"
compatibility_date = "2026-08-01"

# Both default to TRUE when absent, and the first deploy (2026-08-31) said so in
# two warnings. This Worker exports only `scheduled` — there is no `fetch`
# handler — so the workers.dev hostname could not invoke the probe even while it
# existed; it answered errors. It was still a public hostname on the account for
# a Worker nothing should reach from outside, plus a preview URL per version. A
# cron job wants neither, so both are stated rather than left to a default that
# decides what is exposed.
workers_dev = false
preview_urls = false

# Every 5 minutes. The Terraform alert (infra/observability.tf,
# edge_probe_availability) counts successful results over a 30-minute window
# and fires below 3, so this cadence gives it 6 expected data points per
# window. The extra headroom is deliberate (T-745): App Insights availability
# rows land 1-3 minutes late and sometimes later, so a window with no slack
# treats normal ingestion lag as a missed probe. Change one and you must change
# the other.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# The same URL, over the same Cloudflare path, that the disarmed standard web
# test in infra/observability.tf would have asked.
PROBE_URL = "https://api-azure.hybridcloudworks.com/api/health"
# Must match the name filter in the edge_probe_availability alert query —
# infra/observability.tf points back at this line.
PROBE_NAME = "edge-api-health"

# Workers Logs, on (T-746). `scheduled` calls runProbe without a catch and
# runProbe deliberately does not trap the ingestion POST — correct, one-sided
# design — but with no observability block the rejection went NOWHERE. When
# alert-api-reachability fires, the three causes it deliberately conflates (API
# unreachable / Worker or cron dead / ingestion path dead) had no tiebreaker
# anywhere, and a mistyped `wrangler secret put` produced a permanent Sev 1
# with parseConnectionString throwing silently every five minutes. This is the
# only place that distinguishes them, and it matters most at first deploy.
[observability]
enabled = true
