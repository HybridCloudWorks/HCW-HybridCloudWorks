name: secret-sync

# Distribute secrets from SOPS-encrypted file to GitHub Actions + Firebase
# Triggered by: secret-encrypt workflow or manual dispatch

on:
  push:
    paths:
      - 'infrastructure/secrets/.secrets.enc.yaml'
      - '.sops.yaml'
      - '.github/workflows/secret-sync.yml'
    branches: [main]
  workflow_dispatch: {}

env:
  SOPS_VERSION: 3.8.1

jobs:
  sync:
    name: Distribute Secrets
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup SOPS
        run: |
          mkdir -p $HOME/.local/bin
          wget -O $HOME/.local/bin/sops https://github.com/getsops/sops/releases/download/v${{ env.SOPS_VERSION }}/sops-v${{ env.SOPS_VERSION }}.linux.amd64
          chmod +x $HOME/.local/bin/sops
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup age key
        run: |
          mkdir -p $HOME/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > $HOME/.config/sops/age/keys.txt
          chmod 600 $HOME/.config/sops/age/keys.txt

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Decrypt secrets
        run: |
          sops -d infrastructure/secrets/.secrets.enc.yaml > secrets.yaml
          [ ! -s secrets.yaml ] && { echo "❌ Decrypted file is empty"; exit 1; }
          echo "✅ Secrets decrypted"

      - name: Sync to GitHub Actions Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_KEY }}
        run: |
          python3 -c "
          import sys, yaml, subprocess, os

          with open('secrets.yaml', 'r') as f:
              secrets = yaml.safe_load(f)

          targets = ['VITE_', 'FIREBASE_', 'GCP_', 'NOTION_']
          filtered = {k: v for k, v in secrets.items() if any(k.startswith(t) for t in targets)}

          if not filtered:
              print('⚠️ No matching secrets for GitHub Actions')
              sys.exit(0)

          for key, value in filtered.items():
              val_str = str(value).strip()
              print(f'   Setting {key}...')
              proc = subprocess.Popen(
                  ['gh', 'secret', 'set', key],
                  stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
              )
              stdout, stderr = proc.communicate(input=val_str)
              if proc.returncode != 0:
                  print(f'❌ Failed: {key}: {stderr.strip()}')
              else:
                  print(f'✅ {key}')
          "

      - name: Sync to Firebase Secret Manager
        env:
          FIREBASE_TOKEN: ${{ secrets.VITE_FIREBASE_TOKEN }}
          PROJECT_ID: "hybridcloudworks-61e8d"
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️ VITE_FIREBASE_TOKEN not set, skipping"
            exit 0
          fi

          python3 -c "
          import sys, yaml, subprocess, os

          with open('secrets.yaml', 'r') as f:
              secrets = yaml.safe_load(f)

          targets = ['OPENAI_', 'ANTHROPIC_', 'CLAUDE_', 'GEMINI_', 'PERPLEXITY_', 'REPLICATE_', 'FIRECRAWL_', 'PUBLER_', 'LINKIE_', 'KLAVIYO_', 'WIKIJS_', 'RESEND_', 'NOTION_', 'N8N_']
          filtered = {k: v for k, v in secrets.items() if any(k.startswith(t) for t in targets)}

          if not filtered:
              print('⚠️ No matching secrets for Firebase')
              sys.exit(0)

          for key, value in filtered.items():
              val_str = str(value).strip()
              print(f'   Setting {key}...')
              cmd = ['npx', 'firebase', 'functions:secrets:set', key, '--project', os.environ['PROJECT_ID'], '--force']
              proc = subprocess.Popen(
                  cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
              )
              stdout, stderr = proc.communicate(input=val_str)
              if proc.returncode != 0:
                  print(f'❌ Failed: {key}: {stderr.strip()}')
              else:
                  print(f'✅ {key}')
          "

      - name: Cleanup
        if: always()
        run: rm -f secrets.yaml
