name: secrets-terraform

# Sync specific secrets from Notion into a Terraform Cloud workspace

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no changes)"
        required: false
        default: "false"
  workflow_call: {}

jobs:
  sync:
    name: sync-terraform-cloud-vars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Validate Notion credentials
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_SECRETS_DB_ID: ${{ secrets.NOTION_SECRETS_DB_ID }}
        run: |
          [ -z "${NOTION_API_TOKEN:-}" ] && { echo "❌ NOTION_API_TOKEN not set"; exit 1; }
          [ -z "${NOTION_SECRETS_DB_ID:-}" ] && { echo "❌ NOTION_SECRETS_DB_ID not set"; exit 1; }
          echo "✅ Notion credentials configured"

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Fetch secrets from Notion
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_SECRETS_DB_ID: ${{ secrets.NOTION_SECRETS_DB_ID }}
        run: |
          cd scripts
          node notion-to-yaml.js \
            --db-id "$NOTION_SECRETS_DB_ID" \
            --output /tmp/notion-secrets.yaml \
            --filter all

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq yq

      - name: Sync to Terraform Cloud
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          #!/bin/bash
          set -euo pipefail

          SECRETS_FILE="/tmp/notion-secrets.yaml"
          if [[ ! -f "$SECRETS_FILE" ]]; then
            echo "❌ Missing Notion secrets file"
            exit 1
          fi

          # Extract secrets using yq (YAML processor)
          get_secret() {
            yq -r ".${1} // \"\"" "$SECRETS_FILE" | xargs
          }

          # Required secrets
          REQUIRED_SECRETS=(
            "TERRAFORM_API_KEY"
            "TERRAFORM_WS_ID"
            "VPS_API_TOKEN"
            "CLOUDFLARE_DNS_API_TOKEN"
            "CLOUDFLARE_ZONE_ID"
            "VPS_SSH_KEY"
            "VPS_HOST_IP"
            "VPS_HOST_ID"
          )

          # Terraform Cloud variable mapping (Notion key -> TF variable name:sensitive)
          declare -A MAPPING=(
            ["VPS_API_TOKEN"]="hostinger_api_token:true"
            ["CLOUDFLARE_DNS_API_TOKEN"]="cloudflare_api_token:true"
            ["CLOUDFLARE_ZONE_ID"]="cloudflare_zone_id:true"
            ["VPS_SSH_KEY"]="ssh_public_key:false"
            ["VPS_HOST_IP"]="vps_ipv4:false"
            ["VPS_HOST_ID"]="vps_id:false"
          )

          # Validate all secrets exist
          MISSING=()
          for notion_key in "${REQUIRED_SECRETS[@]}"; do
            value=$(get_secret "$notion_key")
            if [[ -z "$value" ]]; then
              MISSING+=("$notion_key")
            fi
          done

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "❌ Missing secrets in Notion:"
            printf "  - %s\n" "${MISSING[@]}"
            exit 1
          fi

          # Get auth token and workspace ID
          TFC_TOKEN=$(get_secret "TERRAFORM_API_KEY")
          WORKSPACE_ID=$(get_secret "TERRAFORM_WS_ID")

          if [[ -z "$TFC_TOKEN" ]]; then
            echo "❌ TERRAFORM_API_KEY is empty"
            exit 1
          fi

          if [[ -z "$WORKSPACE_ID" ]]; then
            echo "❌ TERRAFORM_WS_ID is empty"
            exit 1
          fi

          API_BASE="https://app.terraform.io/api/v2"
          DRY_RUN="${DRY_RUN:-false}"

          # Fetch existing variables
          echo "🔍 Fetching existing Terraform Cloud variables..."
          EXISTING_VARS=$(curl -s -H "Authorization: Bearer $TFC_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            "$API_BASE/workspaces/$WORKSPACE_ID/vars")

          # Function to check if variable exists
          var_exists() {
            local key="$1"
            echo "$EXISTING_VARS" | jq -r --arg key "$key" \
              '.data[] | select(.attributes.key == $key) | .id' 2>/dev/null || echo ""
          }

          # Function to create/update variable
          sync_var() {
            local notion_key="$1"
            local mapping="${MAPPING[$notion_key]}"
            local tf_key="${mapping%%:*}"
            local sensitive="${mapping##*:}"
            
            # Skip workspace ID (it's not a TF variable)
            if [[ "$tf_key" == "__workspace_id" ]]; then
              return 0
            fi

            local value=$(get_secret "$notion_key")
            if [[ -z "$value" ]]; then
              echo "❌ $notion_key is empty"
              exit 1
            fi

            local var_id=$(var_exists "$tf_key")
            local method="POST"
            local url="$API_BASE/workspaces/$WORKSPACE_ID/vars"

            if [[ -n "$var_id" ]]; then
              method="PATCH"
              url="$API_BASE/vars/$var_id"
            fi

            # Build payload with jq so values are properly JSON-escaped
            # (jq -Rs reads value as raw string; --argjson injects bool literal)
            local payload
            payload=$(jq -n \
              --arg key "$tf_key" \
              --arg value "$value" \
              --argjson sensitive "$sensitive" \
              '{data:{type:"vars",attributes:{key:$key,value:$value,category:"terraform",sensitive:$sensitive,hcl:false}}}')

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  - $method $tf_key"
              return 0
            fi

            local response=$(curl -s -w "\n%{http_code}" \
              -X "$method" \
              -H "Authorization: Bearer $TFC_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              -d "$payload" \
              "$url")

            local http_code=$(echo "$response" | tail -n1)
            local body=$(echo "$response" | sed '$d')

            if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
              echo "✅ Synced $tf_key ($method)"
            else
              echo "❌ Failed to sync $tf_key — HTTP $http_code"
              echo "$body"
              exit 1
            fi
          }

          # Iterate mapping and sync
          for nk in "${!MAPPING[@]}"; do
            sync_var "$nk"
          done

          echo "✅ Terraform Cloud sync completed"
