name: check-quality

# Code quality: ESLint, Prettier, Unit Tests, Accessibility
# Runs on PRs and on-demand

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'functions/**'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (no warnings allowed)
        id: eslint
        run: |
          set +e
          npm run lint -- --max-warnings=0 2>&1 | tee eslint-output.txt
          exit_code=$?
          set -e
          exit $exit_code

      - name: Validate provider route/page contract
        run: npm run validate:providers

      - name: Validate provider/content matrix
        run: npm run validate:content-matrix

      - name: Upload ESLint results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eslint-report
          path: eslint-output.txt
          retention-days: 3

      - name: Comment PR on failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('eslint-output.txt', 'utf-8');
            const lines = output.split('\n').slice(-50);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ ESLint Issues\n\n\`\`\`\n${lines.join('\n')}\n\`\`\`\n\nFix with: \`npm run lint:fix\``
            });

  format:
    name: Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  verify-required:
    name: Required Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run admin unit tests
        run: npm run test:admin

  verify-security:
    name: Security Rules Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run test:rules

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, format, verify-required, verify-security]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ ESLint failed" && exit 1
          fi
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "❌ Prettier failed" && exit 1
          fi
          if [ "${{ needs.verify-required.result }}" != "success" ]; then
            echo "❌ Required verification failed" && exit 1
          fi
          if [ "${{ needs.verify-security.result }}" != "success" ]; then
            echo "❌ Security rules verification failed" && exit 1
          fi
          echo "✅ All quality checks passed!"
