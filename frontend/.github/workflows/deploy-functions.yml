name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'platform/firebase/firestore.rules'
      - 'platform/firebase/firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    name: Deploy Firebase Backend
    # F-IaC-01: Explicit least-privilege permissions — prevents accidental write
    # access from the default repo-level token inherited when no block is present.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: functions

      - name: Deploy functions, Firestore rules, and indexes
        uses: w9jds/firebase-action@b3c725170700a48b168a32972e7aaa4c92bf1061 # master
        with:
          args: deploy --only functions,firestore:rules,firestore:indexes
        env:
          # VITE_FIREBASE_TOKEN: naming is misleading but safe — GitHub Actions secrets
          # are never passed to the Vite build process, so the VITE_ prefix here does
          # not cause this token to be bundled into client JS. No rename needed.
          FIREBASE_TOKEN: ${{ secrets.VITE_FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
