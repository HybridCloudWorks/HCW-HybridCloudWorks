name: secret-rotate

# Monthly rotation of internally-managed secrets
#
# Rotates: DB credentials, message queue passwords, app secrets, admin passwords
# Process:
# 1. Query Notion for secrets with NextRotation <= today
# 2. Generate new random values for auto-rotatable secrets
# 3. Update Notion database with new values + metadata
# 4. Trigger secret-encrypt → secret-sync pipeline

on:
  schedule:
    - cron: '0 0 1 * *' # 1st of each month
  workflow_dispatch:
    inputs:
      force_rotation:
        description: 'Force rotation of all eligible secrets'
        required: false
        type: boolean
        default: false
      include_manual:
        description: 'Include manual-rotation secrets in output'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        type: boolean
        default: false

env:
  NOTION_SECRETS_DB_ID: ${{ secrets.NOTION_SECRETS_DB_ID }}

permissions:
  contents: read
  actions: write

jobs:
  rotate:
    name: Rotate & Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Rotate secrets
        run: |
          cd scripts
          CMD="node rotate-and-sync-notion.js --db-id '$NOTION_SECRETS_DB_ID'"
          [ "${{ github.event.inputs.force_rotation }}" = "true" ] && CMD="$CMD --force"
          [ "${{ github.event.inputs.include_manual }}" = "true" ] && CMD="$CMD --include-manual"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          eval "$CMD"
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## 🔄 Secret Rotation" >> $GITHUB_STEP_SUMMARY
          echo "- Queried Notion for rotation candidates" >> $GITHUB_STEP_SUMMARY
          echo "- Generated new values → updated Notion → triggered sync" >> $GITHUB_STEP_SUMMARY
