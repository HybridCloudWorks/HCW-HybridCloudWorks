name: secrets-resync

# End-to-end re-sync: encrypt from Notion → distribute everywhere.
#
# This is a convenience wrapper that chains:
#   secret-encrypt → secret-sync → secrets-terraform
#
# Use this when:
#   - Initial bootstrap (after running scripts/bootstrap-secrets.ps1)
#   - You changed many secrets in Notion at once and want a single button to push them all
#   - SOPS key was rotated and you need to re-encrypt + re-distribute
#
# For routine single-secret edits, you can also just run secret-encrypt.yml —
# it auto-triggers secret-sync on commit.

on:
  workflow_dispatch:
    inputs:
      include_terraform:
        description: 'Also sync to Terraform Cloud (VPS/Cloudflare vars)'
        type: boolean
        required: false
        default: true
      commit_message:
        description: 'Commit message for the SOPS file'
        type: string
        required: false
        default: 'chore(secrets): full resync from Notion'

permissions:
  contents: write
  actions: write

jobs:
  encrypt:
    name: 1️⃣  Notion → SOPS (encrypt)
    uses: ./.github/workflows/secret-encrypt.yml
    secrets: inherit
    with:
      commit_message: ${{ inputs.commit_message }}

  wait-for-sync:
    name: 2️⃣  Wait for secret-sync (auto-triggered)
    needs: encrypt
    runs-on: ubuntu-latest
    steps:
      - name: Poll for secret-sync run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "secret-sync.yml is triggered by the push from encrypt step."
          echo "Waiting 15s for it to register..."
          sleep 15
          echo "Polling for its completion..."
          for i in $(seq 1 30); do
            STATUS=$(gh run list --workflow=secret-sync.yml --limit 1 --json status,conclusion --jq '.[0]')
            STATE=$(echo "$STATUS" | jq -r '.status')
            CONC=$(echo "$STATUS" | jq -r '.conclusion')
            echo "Attempt $i: status=$STATE conclusion=$CONC"
            if [ "$STATE" = "completed" ]; then
              if [ "$CONC" = "success" ]; then
                echo "secret-sync completed successfully"
                exit 0
              else
                echo "secret-sync failed: $CONC"
                exit 1
              fi
            fi
            sleep 20
          done
          echo "Timed out waiting for secret-sync (10 min). Check Actions tab."
          exit 1
        shell: bash

  terraform:
    name: 3️⃣  Sync to Terraform Cloud
    needs: wait-for-sync
    if: ${{ inputs.include_terraform }}
    uses: ./.github/workflows/secrets-terraform.yml
    secrets: inherit

  summary:
    name: ✅ Summary
    needs: [encrypt, wait-for-sync, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## 🔐 Full Secrets Re-sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Notion → SOPS encrypt | ${{ needs.encrypt.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub + Firebase sync | ${{ needs.wait-for-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Cloud sync | ${{ needs.terraform.result }} |" >> $GITHUB_STEP_SUMMARY
