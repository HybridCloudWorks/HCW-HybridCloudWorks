name: secret-encrypt

# Sync secrets from Notion database to .secrets.enc.yaml (SOPS encrypted)
# Notion is the single source of truth for all secrets.
#
# Process:
# 1. Fetches all secrets from Notion database via API
# 2. Generates .secrets.yaml in standardized format
# 3. Encrypts with SOPS using age public key
# 4. Commits to repository
# 5. Triggers secret-sync workflow to distribute to targets

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Custom commit message (optional)'
        required: false
        type: string
  workflow_call:
    inputs:
      commit_message:
        description: 'Custom commit message (optional)'
        required: false
        type: string

env:
  NOTION_SECRETS_DB_ID: ${{ secrets.NOTION_SECRETS_DB_ID }}

jobs:
  notion-to-sops:
    name: Notion → SOPS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Validate Notion credentials
        run: |
          [ -z "${NOTION_API_TOKEN:-}" ] && { echo "❌ NOTION_API_TOKEN not set"; exit 1; }
          [ -z "${NOTION_SECRETS_DB_ID}" ] && { echo "❌ NOTION_SECRETS_DB_ID not set"; exit 1; }
          echo "✓ Notion credentials configured"
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Fetch secrets from Notion
        run: |
          cd scripts
          node notion-to-yaml.js \
            --db-id "$NOTION_SECRETS_DB_ID" \
            --output /tmp/secrets.yaml \
            --filter all
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}

      - name: Verify generated secrets
        run: |
          [ ! -f /tmp/secrets.yaml ] && { echo "❌ Failed to generate secrets.yaml"; exit 1; }
          SECRETS=$(grep -c '^[A-Z0-9_]*:' /tmp/secrets.yaml || echo 0)
          echo "✓ Generated $SECRETS secrets"

      - name: Install SOPS and age
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          SOPS_VERSION=3.11.0
          sudo curl -fsSL \
            https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64 \
            -o /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops

      - name: Setup age key
        run: |
          mkdir -p ~/.config/sops/age
          printf '%s\n' "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> $GITHUB_ENV

      - name: Encrypt with SOPS
        run: |
          mkdir -p infrastructure/secrets
          cd infrastructure/secrets
          cp /tmp/secrets.yaml .

          python3 -c "import yaml; yaml.safe_load(open('secrets.yaml'))" && echo "✓ YAML valid" || { echo "❌ YAML invalid"; exit 1; }

          # Verify age key file exists and has content
          [ -s "$SOPS_AGE_KEY_FILE" ] && echo "✓ Age key file present" || { echo "❌ Age key file missing or empty"; exit 1; }

          # Encrypt with SOPS (show errors to stdout)
          sops -e --input-type yaml secrets.yaml > .secrets.enc.yaml
          grep -q "sops:" .secrets.enc.yaml || { echo "❌ Encryption failed - output does not contain SOPS metadata"; cat .secrets.enc.yaml; exit 1; }
          echo "✓ Encrypted successfully"

          rm -f secrets.yaml

      - name: Commit and push
        id: changes
        run: |
          cd infrastructure/secrets
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .secrets.enc.yaml

          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes"
          else
            COMMIT_MSG="${{ github.event.inputs.commit_message }}"
            [ -z "$COMMIT_MSG" ] && COMMIT_MSG="chore(secrets): sync from Notion"
            git commit -m "$COMMIT_MSG"
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger secret sync
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run secret-sync.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_KEY }}

      - name: Summary
        run: |
          echo "## 🔐 Secret Encrypt" >> $GITHUB_STEP_SUMMARY
          echo "- Output: \`infrastructure/secrets/.secrets.enc.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "- Changes: ${{ steps.changes.outputs.changed == 'true' && 'Yes — triggered sync' || 'None' }}" >> $GITHUB_STEP_SUMMARY
