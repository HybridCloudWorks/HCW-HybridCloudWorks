name: update-microsoft-credentials

on:
  schedule:
    # GitHub cron is UTC. This is 03:00 America/Chicago during daylight time.
    - cron: '0 8 * * 0'
  workflow_dispatch: {}

concurrency:
  group: update-microsoft-credentials
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Refresh Microsoft Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh credential source data
        run: npm run data:update:credentials

      - name: Check build
        run: npm run build

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/azure/certifications.js; then
            echo "No credential changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/azure/certifications.js
          git commit -m "chore: Update Microsoft credential data"
          git push
