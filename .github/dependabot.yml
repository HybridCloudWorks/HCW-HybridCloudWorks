version: 2

# Grouping policy. Every ecosystem batches minor and patch into one PR and
# majors into a second. Majors are deliberately kept out of the safe batch: a
# breaking bump that fails review would otherwise hold back the routine updates
# alongside it. Leaving majors ungrouped entirely was the noisier failure --
# 2026-08-24 produced three grouped PRs for fourteen updates and six separate
# single-package PRs, all of them majors.
#
# cooldown keeps a release from landing the day it is published. That is a
# supply-chain control as much as a noise control: a compromised or yanked
# release is usually caught within days, and nothing here is urgent enough to
# need same-day adoption. Security updates ignore cooldown.

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
      frontend-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      azure-functions-minor-patch:
        update-types:
          - minor
          - patch
      azure-functions-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      operations-scripts-minor-patch:
        update-types:
          - minor
          - patch
      operations-scripts-major:
        update-types:
          - major

  # The Cloudflare Worker (T-747). It has no dependencies today, so this adds
  # nothing immediately — which is exactly why it is cheap to add now, rather
  # than discovering later that a package entered an unwatched directory.
  - package-ecosystem: npm
    directory: /edge/availability-probe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: npm
    directory: /vps-agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      vps-agent-minor-patch:
        update-types:
          - minor
          - patch
      vps-agent-major:
        update-types:
          - major

  # Actions are SHA-pinned with a version comment, so every bump is the same
  # two-line shape and they review well as one PR regardless of semver level.
  # Splitting majors out here would only recreate the three-same-day-PRs case.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      github-actions:
        update-types:
          - major
          - minor
          - patch

  # infra/.terraform.lock.hcl is deliberately committed (see .gitignore) because
  # the azurerm pin is `~> 4.0` and an uncommitted lock lets CI resolve a
  # different provider version than a developer does. Nothing kept that lock
  # current until now, so the pin quietly drifted from what CI actually ran.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # No semver-major-days here: Dependabot does not support that property
      # for the terraform ecosystem, and its presence made the WHOLE file
      # invalid — so no ecosystem got updates, not just this one. The failure
      # was latent because Dependabot only re-validates when the file changes,
      # and nothing had changed it since the property was copied over from the
      # npm entries above. The github-actions entry already gets this right.
      default-days: 3
    groups:
      infra-terraform-minor-patch:
        update-types:
          - minor
          - patch
      infra-terraform-major:
        update-types:
          - major
