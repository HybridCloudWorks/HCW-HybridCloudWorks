name: "HCW CodeQL config"

# `.claude/` and `.agents/` hold the vendored Claude Code agent harness — skill
# and agent bundles whose `scripts/*.py` are security *demonstration* code
# (e.g. a hash-cracking skill that hashes with MD5, a TLS skill that enables
# legacy protocols to show them off). They are deliberately source-controlled
# (see scripts/validate-repository-structure.ps1, which treats them as the
# harness, not the site) but are never imported or executed by the application
# or its CI. Scanning them produced 100+ alerts that are either intentional to
# the lesson or outright false positives (logging an OAuth endpoint URL flagged
# as a "secret"). Exclude them so code scanning covers only first-party code.
#
# Note: paths-ignore applies to the interpreted languages CodeQL analyses here
# (JavaScript/TypeScript; the 'actions' language scans .github/workflows and is
# unaffected), which is exactly this repository's first-party surface. The
# harness also vendors stray Go/Java snippet files — the reason the retired
# Default setup grew erroring language:go / language:java-kotlin
# configurations; they are excluded here and deliberately NOT added to the
# advanced matrix.
paths-ignore:
  - '.claude'
  - '.agents'
