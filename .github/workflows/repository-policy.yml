name: Repository Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate root and documentation policy
    # Same failover switch as ci.yml — see Review.md §4.4.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure
        shell: pwsh
        run: ./scripts/validate-repository-structure.ps1
