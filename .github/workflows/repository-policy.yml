name: Repository Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate root and documentation policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure
        shell: pwsh
        run: ./scripts/validate-repository-structure.ps1

      # Parses every .ps1/.psm1 and checks its bytes. Four defects were found in
      # cutover/05-verify-timer.ps1 in one evening on 2026-08-30 — one of them a
      # BOM — and none by a check, because nothing in CI had ever loaded a
      # PowerShell file other than the validator above. A syntax error in a
      # cutover script surfaces when an operator runs it, which is the worst
      # possible time to find one.
      - name: Validate PowerShell syntax and encoding
        shell: pwsh
        run: ./scripts/validate-powershell.ps1

      # The gate above shipped with a defect its own mutation testing missed:
      # under $ErrorActionPreference = 'Stop' it printed one finding and stopped,
      # while still exiting 1 — so CI looked identical with the bug and without
      # it. These run it against fixtures of deliberately broken files and assert
      # on its OUTPUT, which is the only way that class of bug is visible.
      - name: Test the PowerShell validator
        shell: pwsh
        run: ./scripts/validate-powershell.tests.ps1

      # 05-verify-timer.ps1 hands a multi-line KQL query to `az`, which on a
      # Windows operator's machine is a batch file that cannot receive an
      # argument containing a newline — so the query arrived truncated at the
      # first line break and the call still exited 0. Azure answered a
      # different question with tens of thousands of unfiltered rows, four
      # times, over a week, and the wrong number was reported as a count each
      # time. Nothing caught it because the script's internals could not run
      # without an Azure login. These cover the flatten and the row-shape
      # assertion off-line, which is the only reason either is testable.
      - name: Test the workspace query helpers
        shell: pwsh
        run: ./scripts/cutover/workspace-query.tests.ps1
