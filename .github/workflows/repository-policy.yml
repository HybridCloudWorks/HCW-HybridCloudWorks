name: Repository Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate root and documentation policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure
        shell: pwsh
        run: ./scripts/validate-repository-structure.ps1

      # Parses every .ps1/.psm1 and checks its bytes. Four defects were found in
      # cutover/05-verify-timer.ps1 in one evening on 2026-08-30 — one of them a
      # BOM — and none by a check, because nothing in CI had ever loaded a
      # PowerShell file other than the validator above. A syntax error in a
      # cutover script surfaces when an operator runs it, which is the worst
      # possible time to find one.
      - name: Validate PowerShell syntax and encoding
        shell: pwsh
        run: ./scripts/validate-powershell.ps1
