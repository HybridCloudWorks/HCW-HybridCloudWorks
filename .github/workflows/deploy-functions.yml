name: Deploy Functions

# Manual release workflow, dispatch-only.
#
# The push trigger is deliberately commented out rather than deleted. Enabling
# Enabling this workflow and enabling auto-deploy-on-merge are separate
# decisions. Keep releases observable until the deployment and smoke checks
# have an approved automatic-release policy.
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'functions/**'
on:
  workflow_dispatch:

# The workflow-level default. `id-token: write` is granted on the job that uses
# it rather than here (zizmor excessive-permissions, #588): this workflow has
# one job today, so the two are identical in effect — what a job-level grant
# prevents is a second job added later silently inheriting the OIDC token.
permissions:
  contents: read # the checkout, nothing more

# One deploy at a time. Two overlapping runs would swap packages under each
# other and race on SyncTriggers; never cancel one that is mid-flight, because
# a half-deployed package is worse than a queued run.
concurrency:
  group: function-app-host
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure Functions
    permissions:
      contents: read # the checkout, nothing more
      id-token: write # exchanged by azure/login for an Azure access token
    runs-on: ubuntu-latest
    # Binding the job to an environment gives production deploys a deployment
    # history and a place to hang an approval gate. It does NOT create the gate
    # on its own: GitHub auto-creates a missing environment with no protection
    # rules, so until required reviewers are configured on the `production`
    # environment this records who deployed without gating whether they may.
    environment: production
    steps:
      - name: Refuse a deploy from a ref that is not main
        # The `production` environment records who deployed but does not gate
        # whether they may: GitHub auto-creates a missing environment with no
        # protection rules, and the federated credential's subject is
        # environment-scoped, so it matches from ANY branch. Without this step
        # a dispatch from an unreviewed ref ships to production past all 12
        # required contexts (T-705). This is the repository-side half; the
        # durable fix is required reviewers plus a main-only branch
        # restriction on the environment itself, which only a repo admin can
        # configure.
        if: github.ref != 'refs/heads/main'
        run: |
          # Workflow-command data must percent-encode %, CR and LF, and a branch
          # name may legally contain %; unescaped, it could misparse the annotation.
          ref="${GITHUB_REF//%/%25}"
          ref="${ref//$'\r'/%0D}"
          ref="${ref//$'\n'/%0A}"
          echo "::error::Refusing to deploy from ${ref}. Production deploys run from main only."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          # No npm cache here (#563). A production deploy must build from a clean
          # npm install, not restore a cache another workflow run could have
          # written: a poisoned cache would ship straight to production.
          # setup-node v5+ caches automatically unless told not to.
          package-manager-cache: false

      # `concurrency: function-app-host` above serialises deploys against each
      # other and knows nothing about Terraform, which runs in HCP Terraform
      # rather than in Actions. On 2026-09-09 a deploy and an apply wrote the
      # app-settings map three minutes apart and six settings were lost, because
      # ARM's appsettings PUT replaces rather than merges and the deploy's
      # closing write replayed the map it had read before the apply (#454).
      #
      # Deliberately BEFORE the firewall windows open: a refusal here leaves
      # nothing to unwind. Self-arming — no TFC_TOKEN and it says so and passes,
      # because a guard that cannot run must not be why releases stop.
      - name: Refuse to deploy while a Terraform apply is running
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: node scripts/tfc-workspace-busy.mjs

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Federated OIDC — no stored credential. These three are repository
      # VARIABLES, not secrets: they identify the managed identity but grant
      # nothing without an OIDC token from this repo and ref. Their values come
      # from the `client_id` Terraform output and the subscription
      # and tenant the workspace targets.
      #
      # On AADSTS70021 ("no matching federated identity record found"), compare
      # the token's subject against the `federated_subjects`
      # output — the usual cause is a ref or repository name that has moved.
      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      # T-503: the Functions host storage account is default-Deny, and this
      # runner has a public dynamic IP, so the deployment-package upload needs
      # a firewall window: add this runner's IP, deploy, remove it in an
      # always-run cleanup. Authorized by the deploy identity's Storage
      # Account Contributor grant scoped to exactly this account (infra/
      # oidc.tf github_deploy_funcsa_network). The rule add is eventually
      # consistent — the short wait lets it propagate before the upload.
      #
      # An IP rule alone is not enough: GitHub-hosted runners are Azure VMs, and
      # the storage firewall ignores IP rules for requests from the account's
      # own region. The default action is opened to Allow for the minutes
      # of the upload too — data-plane access still needs an Entra token with
      # a blob role, allowBlobPublicAccess is false — and the always() step
      # restores Deny first.
      - name: Open storage firewall window for this runner
        id: fw
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          SA: ${{ vars.FUNCTIONS_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sS --max-time 10 https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az storage account network-rule add \
            --resource-group "${RG}" \
            --account-name "${SA}" \
            --ip-address "${RUNNER_IP}" \
            --output none
          az storage account update \
            --resource-group "${RG}" \
            --name "${SA}" \
            --default-action Allow --output none
          sleep 30
      # T-520: SCM (Kudu) is the endpoint this deploy publishes through, and it
      # answers the internet. The credential half is already closed — basic
      # authentication is off on SCM and FTP, so a caller must present an Entra
      # token — but the endpoint itself is reachable, which is the half this
      # window closes.
      #
      # Unlike the storage account above, SCM needs NO default-action flip. The
      # storage firewall ignores IP rules for requests from the account's own
      # region, which forced Allow for the length of the upload; App Service
      # honours SCM IP rules normally, so an allow rule for this runner is
      # sufficient and the standing posture is never widened. That is why this
      # step adds a rule and the close step asserts the posture is unchanged,
      # rather than restoring a Deny it took away.
      #
      # The baseline is READ rather than assumed. While
      # infra/variables.tf functions_scm_lock_enabled is false the default
      # action is Allow and this window is a no-op that costs one API call;
      # when the owner flips it to Deny the same steps become load-bearing with
      # no edit here. Asserting "unchanged" works in both postures, where
      # asserting "Deny is back" would fail every deploy until the flip.
      - name: Open SCM firewall window for this runner
        id: scmfw
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sS --max-time 10 https://api.ipify.org)
          RULE="ci-deploy-scm-${GITHUB_RUN_ID}"

          # If SCM inherits the main site's rules, an SCM rule is ignored and
          # the Cloudflare-only origin lock applies to Kudu as well — a runner
          # would be refused with the window apparently open. Fail loudly here
          # rather than as an opaque 403 mid-deploy.
          use_main=$(az functionapp config access-restriction show -n "$APP" -g "$RG"             --query "scmIpSecurityRestrictionsUseMain" -o tsv)
          if [ "$use_main" != "false" ]; then
            echo "::error::scmIpSecurityRestrictionsUseMain is '$use_main'; SCM inherits the main site's rules, so an SCM allow rule cannot admit this runner. Set scm_use_main_ip_restriction = false in infra/ before arming the SCM lock."
            exit 1
          fi

          BASELINE=$(az functionapp config access-restriction show -n "$APP" -g "$RG"             --query "scmIpSecurityRestrictionsDefaultAction" -o tsv)
          echo "scm default action before the window: $BASELINE"

          az functionapp config access-restriction add             --resource-group "$RG"             --name "$APP"             --rule-name "$RULE"             --action Allow --ip-address "${RUNNER_IP}/32" --priority 300             --scm-site true             --output none

          echo "rule_name=${RULE}" >> "$GITHUB_OUTPUT"
          echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"
          sleep 20

      # A repository VARIABLE, seeded from the `function_app_name` Terraform
      # output by scripts/set-github-variables.ps1 — never a literal here.
      #
      # It was a literal until 2026-08-20 and had gone stale twice over: this
      # step read `func-site-prod-scus` and functions/package.json read
      # `hcw-functions-prod`, an estate older still. Neither app exists, so the
      # first deploy would have failed on "app not found" — which reads as a
      # permissions or wrong-subscription problem long before it reads as a
      # name that was renamed out from under a hardcoded string.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: functions/
          respect-funcignore: true

      # `AzureWebJobsStorage` must NOT be on this app. A connection string with
      # an empty AccountKey makes the host attempt shared-key auth with no key
      # against its own secret repository, and the failure does not present as
      # storage: SyncTriggers stops registering new functions (which reads as a
      # build or routing problem) and every timer and queue listener refuses to
      # start (which reads as nothing at all). Three incidents, all of them
      # diagnosed as something else first.
      #
      # This step used to DELETE the setting on every deploy. That was a
      # bandaid over the actual cause — `azurerm_function_app_flex_consumption`
      # re-injecting it on every apply, azurerm#29149 — which is now stripped
      # inside the apply itself by the azapi pair in infra/main.tf (T-511).
      #
      # So this checks and FAILS rather than repairing. A repair here would
      # hide a regression in the Terraform fix, which is precisely how this
      # became a recurring incident instead of a bug: every occurrence was
      # quietly cleaned up by the next deploy. If this fires, the azapi
      # resources did not run or did not work — re-apply and look at why,
      # rather than deleting the setting by hand.
      - name: Assert AzureWebJobsStorage is absent, then sync triggers
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
          SUB: ${{ vars.SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          present=$(az functionapp config appsettings list -n "$APP" -g "$RG"                       --query "[?name=='AzureWebJobsStorage'] | length(@)" -o tsv)
          if [ "$present" != "0" ]; then
            echo "::error::AzureWebJobsStorage is present on $APP. The apply-time strip           (azapi_update_resource.function_app_settings_without_webjobs_storage, TODO.md T-511)           did not take effect. Timers and SyncTriggers are degraded. Re-apply infra/ and           investigate; do not delete the setting by hand — that hides the regression."
            exit 1
          fi
          echo "AzureWebJobsStorage absent — as the apply-time strip guarantees"

          # The other half of #454. The pre-flight guard refuses to START while
          # a run is going; it cannot stop one that BEGINS after this job read
          # the settings map. So detect the clobber here rather than leaving it
          # to be found days later by a feature that quietly read nothing —
          # which is how the 2026-09-09 loss was actually discovered.
          #
          # Key Vault-referenced settings only. Plain ones like
          # PUBLIC_API_ORIGIN are out of scope because `app_settings` is a
          # merge() with computed maps and no regex over it is safe enough to
          # gate a release on; the script's header argues that in full.
          az functionapp config appsettings list -n "$APP" -g "$RG" --query "[].name" -o tsv \
            | node scripts/assert-live-app-settings.mjs

          # SyncTriggers is still worth doing explicitly: the Flex deploy does
          # not always register newly added triggers on its own, and the host
          # can answer 400 "InternalServerError from host runtime" for ~30 s
          # while it restarts after a package swap (run 32521270400).
          for attempt in 1 2 3 4; do
            if az rest --method post --output none --url "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP/syncfunctiontriggers?api-version=2023-12-01"; then
              break
            fi
            [ "$attempt" -lt 4 ] || { echo "::error::syncfunctiontriggers failed after 4 attempts"; exit 1; }
            echo "syncfunctiontriggers attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          sleep 15
          count=$(az functionapp function list -n "$APP" -g "$RG" --query "length(@)" -o tsv)
          echo "functions registered after sync: $count"
          [ "$count" -gt 0 ] || { echo "::error::no functions registered after SyncTriggers"; exit 1; }

      # Deliberately BEFORE the storage window closes, so the two unwind in the
      # reverse of the order they opened.
      #
      # The assertions are the point of this step, not the removal. A window
      # that silently failed to close is worse than one that never opened: the
      # deploy stays green while the endpoint stays admitted, and the next
      # reader sees a workflow that claims to close it.
      - name: Close SCM firewall window
        if: ${{ always() && steps.scmfw.outputs.rule_name != '' }}
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
          RULE: ${{ steps.scmfw.outputs.rule_name }}
          BASELINE: ${{ steps.scmfw.outputs.baseline }}
        run: |
          set -euo pipefail
          az functionapp config access-restriction remove             --resource-group "$RG"             --name "$APP"             --rule-name "$RULE"             --scm-site true             --output none

          after=$(az functionapp config access-restriction show -n "$APP" -g "$RG"             --query "scmIpSecurityRestrictionsDefaultAction" -o tsv)
          if [ "$after" != "$BASELINE" ]; then
            echo "::error::scm default action is '$after' after the window closed, expected '$BASELINE'"
            exit 1
          fi

          left=$(az functionapp config access-restriction show -n "$APP" -g "$RG"             --query "length(scmIpSecurityRestrictions[?starts_with(name, 'ci-deploy-scm-')])" -o tsv)
          if [ "$left" != "0" ]; then
            echo "::error::${left} ci-deploy-scm-* rule(s) still present on SCM after the window closed"
            exit 1
          fi
          echo "scm window closed — default action '$after', no temporary rules left"
      - name: Close storage firewall window
        if: ${{ always() && steps.fw.outputs.runner_ip != '' }}
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          SA: ${{ vars.FUNCTIONS_STORAGE_ACCOUNT }}
          RUNNER_IP: ${{ steps.fw.outputs.runner_ip }}
        run: |
          # Deny first — this is the part that matters if anything below fails.
          az storage account update \
            --resource-group "${RG}" \
            --name "${SA}" \
            --default-action Deny --output none
          az storage account network-rule remove \
            --resource-group "${RG}" \
            --account-name "${SA}" \
            --ip-address "${RUNNER_IP}" \
            --output none
          az storage account show --resource-group "${RG}" \
            --name "${SA}" \
            --query "networkRuleSet.defaultAction" -o tsv | grep -qx Deny \
            || { echo "::error::default action is not Deny after the window closed"; exit 1; }

      # Probe the ORIGIN through a temporary firewall window, not Cloudflare.
      #
      # Going through Cloudflare does not work and cannot be made to work on
      # this plan. A GitHub-hosted runner asking for /api/health is served
      # Cloudflare's "Just a moment..." interstitial and a 403, and that
      # challenge comes from Bot Fight Mode, which does not run on the Ruleset
      # Engine — so WAF custom rules, skip actions and page rules have no
      # effect on it. A skip rule was built, applied, and confirmed inert
      # before this approach replaced it.
      #
      # The alternative was turning Bot Fight Mode off zone-wide, which would
      # have removed protection from the public site to make one CI check pass.
      #
      # So the runner is admitted to the origin the same way it is already
      # admitted to the host storage account: add its IP, probe, remove it in
      # an always-run cleanup. Authorized by the deploy identity's Website
      # Contributor role on this app.
      #
      # WHAT THIS DOES NOT TEST, deliberately recorded: the Cloudflare path.
      # It proves the app is healthy, not that the proxied route works. The
      # origin-lock assertion below is what keeps that from being a blind spot
      # — if Cloudflare were not the only way in, that check would fail.
      - name: Open origin firewall window for this runner
        id: appfw
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sS --max-time 10 https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az functionapp config access-restriction add \
            --resource-group "${RG}" \
            --name "${APP}" \
            --rule-name "ci-smoke-${GITHUB_RUN_ID}" \
            --action Allow --ip-address "${RUNNER_IP}/32" --priority 300 \
            --output none

      # No fixed wait after the rule add: the smoke test below polls instead.
      # A fixed `sleep 20` here plus one request was not enough on run
      # 36175776422 — the rule had not reached every front end, the request
      # got 403 "Web App - Unavailable", and a healthy deploy went red (#700).
      #
      # The poll is bounded. POLL_BUDGET_S caps the elapsed time at which a
      # further attempt may START (a slow final attempt can overrun it by at
      # most its own curl timeout), and a budget with no 200 fails the step
      # with the last body in the summary — so an app that is really down
      # still fails, about two and a half minutes later than it used to.
      - name: Post-deploy smoke test
        env:
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
          FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}
          POLL_INTERVAL_S: '10'
          POLL_BUDGET_S: '150'
        run: |
          URL="https://${APP_HOSTNAME}/api/health"
          echo "GET $URL  (origin, via the temporary window; every ${POLL_INTERVAL_S} s for up to ${POLL_BUDGET_S} s)"

          started=$SECONDS
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            RESP=$(curl -sS -m 30 -w $'\n%{http_code}' "$URL" 2>&1 || true)
            STATUS=$(printf '%s' "$RESP" | tail -n1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            elapsed=$((SECONDS - started))
            echo "attempt ${attempt} at +${elapsed} s: HTTP ${STATUS}"
            [ "$STATUS" = "200" ] && break
            if [ $((elapsed + POLL_INTERVAL_S)) -gt "$POLL_BUDGET_S" ]; then
              echo "no 200 within ${POLL_BUDGET_S} s"
              break
            fi
            sleep "$POLL_INTERVAL_S"
          done

          echo "status: $STATUS"
          echo "body:   ${BODY:0:400}"

          {
            echo "## 🚀 Azure Functions Deploy Complete"
            echo ""
            echo "\`GET $URL\` → **HTTP $STATUS** (attempt ${attempt}, +${elapsed} s)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "200" ]; then
            {
              echo "❌ Health check: **FAILED**"
              echo ""
              echo "\`\`\`"
              echo "${BODY:0:800}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ Health check: **PASSED**" >> "$GITHUB_STEP_SUMMARY"

          # The origin lock must still refuse everyone else. Without this the
          # window above would quietly become a way to pass the check while the
          # lock was open — a green test asserting the opposite of what it
          # claims. Cloudflare's challenge is what a non-allowlisted caller
          # gets, and a challenge is itself proof the request never reached
          # Azure.
          CF=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" "${FUNCTIONS_URL}/health" || echo "000")
          echo "non-allowlisted path returned: $CF"
          if [ "$CF" = "200" ]; then
            echo "❌ Origin lock: **NOT ENFORCING** — an unlisted caller got 200" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Origin lock: **enforcing** (unlisted caller got HTTP $CF)" >> "$GITHUB_STEP_SUMMARY"

      - name: Close origin firewall window
        if: ${{ always() && steps.appfw.outputs.runner_ip != '' }}
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          az functionapp config access-restriction remove \
            --resource-group "${RG}" \
            --name "${APP}" \
            --rule-name "ci-smoke-${GITHUB_RUN_ID}" \
            --output none
