name: Publish Content Manifest

# Produces frontend/data/content-manifest.json — the published articles that
# scripts/prerender.mjs turns into static HTML.
#
# WHY A SEPARATE WORKFLOW. The frontend build cannot fetch this itself. It runs
# on a GitHub runner, the public API is behind Cloudflare, and Cloudflare answers
# a datacenter IP with a managed challenge (#175). The alternative was a
# permanent bot-protection exception on the API host, which that issue rejected.
#
# So the data comes from the other side: this workflow holds Azure federated
# credentials, reads Cosmos directly with data-plane RBAC, and commits a plain
# JSON file. deploy-azure-frontend.yml keeps `contents: read` and a Static Web
# Apps token — no Azure identity at all — and reads a file from the checkout.
# That separation is the point, not an implementation detail: the build that
# runs on every push should not hold database credentials.
#
# Committed rather than passed as an artifact so a build is reproducible from a
# checkout alone, and so a diff shows what changed about the published set.

on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC daily, after the nightly content timers have run. Articles are
    # published by humans and by the forge, and neither tells this workflow.
    - cron: '15 6 * * *'

# No workflow-level permissions: each job declares its own, and the whole point
# of the split below is that no job holds both (T-726).
permissions: {}

concurrency:
  group: content-manifest
  cancel-in-progress: false

# ============================================================================
# WHY THIS IS TWO JOBS (T-726)
# ============================================================================
# It used to be one, holding `contents: write` AND `id-token: write` — the full
# deploy identity plus the ability to push to main — while running `npm ci` on
# third-party packages. That was the single highest supply-chain concentration
# in the pipeline: any postinstall script in scripts/'s dependency tree ran with
# a token that could push arbitrary commits to a protected branch and an Azure
# federated credential in the same environment.
#
# Now `build` holds the Azure identity and NEVER `contents: write`, and `commit`
# holds `contents: write` and NEVER an Azure identity. Neither is enough on its
# own, and the artifact between them is a plain JSON file. `build` also installs
# with `--ignore-scripts`, so lifecycle scripts do not execute at all — verified
# that the install and the manifest build both succeed without them.
#
# STILL OPEN, and it is an owner action, not a code change: for the push in
# `commit` to land on a main protected by twelve required contexts, the ruleset
# must bypass the Actions token — which means every workflow holding
# `contents: write` can push past all checks. Narrowing that bypass to a deploy
# key scoped to `frontend/data/content-manifest.json`, or replacing the push
# with an auto-merging pull request, needs repository-admin access. Tracked in
# TODO.md. The split above shrinks what can reach that push; it does not remove
# the bypass.
jobs:
  build:
    name: Read Cosmos and build the manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only — this job must never be able to push
      id-token: write # federated credential exchange for azure/login
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      # `--ignore-scripts`: nothing in this tree needs a lifecycle script, and
      # this job holds an Azure credential. Defence in depth behind the job
      # split — the split is what makes a compromised package unable to push.
      - name: Install script dependencies
        working-directory: scripts
        run: npm ci --ignore-scripts

      # DefaultAzureCredential resolves through the CLI session azure/login
      # leaves behind. COSMOS_ENDPOINT is a repository variable, not a secret —
      # the endpoint is public and access is RBAC, not a connection string.
      - name: Build the manifest
        working-directory: scripts
        env:
          COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
        run: node build-content-manifest.mjs

      - name: Upload the manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: content-manifest
          path: frontend/data/content-manifest.json
          retention-days: 1
          if-no-files-found: error

  commit:
    name: Commit the manifest if it changed
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the manifest — and holds no Azure identity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: content-manifest
          path: frontend/data

      # No `npm ci` in this job, deliberately: it holds the token that can push
      # to main, so it installs nothing and runs only git and node's built-ins.
      - name: Commit if the published set changed
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/data/content-manifest.json; then
            echo "No change to the published set."
            exit 0
          fi
          # The script already suppresses timestamp-only rewrites, so reaching
          # here means the article set or its content actually moved.
          routes=$(node -e "console.log(require('./frontend/data/content-manifest.json').routes.length)")
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/data/content-manifest.json
          git commit -m "chore: refresh content manifest ($routes article routes)"
          git push
          echo "::notice::Manifest updated to $routes article routes. Deploy the frontend to publish them."
