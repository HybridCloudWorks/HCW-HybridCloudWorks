# Wiki-as-code: pages under .github/wiki/ are the reviewed source of truth for
# the wiki pages they name, and this workflow overlays them onto the GitHub
# Wiki after a merge to main.
#
# Why this exists: the Wiki is a separate git repository (<repo>.wiki.git)
# that PR review never covers. Staging operational pages (runbooks, standards)
# in-repo puts them through the same review gates as the code they describe;
# this job then publishes them with the built-in GITHUB_TOKEN — no PAT, no
# extra GitHub App.
#
# Semantics are OVERLAY, not mirror: only files present in .github/wiki/ are
# written; wiki pages that are not staged here remain editable in the wiki UI
# and are never deleted by this job. A page, once staged, is owned by the
# repository — direct wiki edits to it will be overwritten on the next sync.

name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - '.github/wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Overlay staged pages onto the wiki
    # Same failover switch as ci.yml — see REVIEW.md §4.4.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Push staged pages to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki
          cp .github/wiki/*.md /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already in sync."
            exit 0
          fi
          git commit -m "Sync wiki pages from .github/wiki @ ${GITHUB_SHA}"
          git push
