# Reads the LIVE state of the alert rules and says whether the deployed
# configuration matches what infra/observability.tf declares.
#
# WHY THIS EXISTS. The Deployment Runbook's §4 asks for post-apply
# verification, and for the alert fabric there was no way to do it: applies
# happen in HCP Terraform Cloud on a human's confirmation, and a green TFC run
# proves ARM ACCEPTED the change, not that the rule now behaves differently.
# The two come apart exactly where it matters — `autoMitigate` is the attribute
# that decides whether a firing rule mails once or every five minutes, and it
# is invisible from the repository, from CI, and from the TFC run list.
#
# It also exists because operators are sometimes on a phone. `az` is not, and
# the TFC run list answers a different question. The report goes to the job
# summary so it is readable from the GitHub mobile app, AND to stdout so it is
# in the logs — the first run of this workflow (2026-08-26) wrote only to the
# summary, which the REST logs API does not expose, so a failure could not be
# diagnosed without opening a browser. A verification tool whose output cannot
# be read programmatically is half a tool.
#
# THE OTHER THING THAT FIRST RUN GOT WRONG: `az ... 2>/dev/null` discarded the
# error, so "the rule does not exist" and "this identity may not read it" both
# rendered as NOT FOUND. Those are opposite diagnoses — the first means the
# alert fabric is gone, the second means this workflow's own grant has not
# applied yet — and the run that surfaced it could not distinguish them. The
# stderr is now captured and classified.
#
# READ-ONLY, and structurally so: the identity's grant for this resource group
# is Monitoring Reader (infra/oidc.tf), whose actions are `*/read` plus alert
# state. There is no verb here that can change anything.
#
# NO `environment:` KEY, deliberately. Declaring one changes the OIDC subject
# GitHub presents from repo:<org>/<repo>:ref:<ref> to
# repo:<org>/<repo>:environment:<name>, and this job is trusted through the
# BRANCH credential. Adding an environment here breaks authentication with
# AADSTS700213 — the failure mode documented at length in infra/oidc.tf.
# Confirmed working on the first run: the presented subject was
# `repo:HybridCloudWorks@312844660/HCW-HybridCloudWorks@1268997852:ref:refs/heads/main`.

name: Verify Alert Rule State

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource group holding the workload alert rules'
        required: false
        default: 'rg-web-site-prod-cus'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    # Same self-arming gate as heal-computed-properties.yml: before the first
    # apply there is no identity to log in as, and a red run would read as a
    # permissions bug while actually meaning "not deployed yet".
    if: ${{ vars.CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Read the live scheduled query rules
        env:
          RG: ${{ inputs.resource_group }}
        run: |
          set -uo pipefail

          RULES="alert-app-exceptions-prod-cus alert-func-http5xx-prod-cus alert-func-latency-prod-cus"

          report=$(mktemp)
          err=$(mktemp)

          {
            echo "## Live alert rule state"
            echo
            echo "Resource group \`$RG\`, read $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "| Rule | autoMitigate | muteActions | frequency | window | severity |"
            echo "| --- | :---: | :---: | --- | --- | :---: |"
          } >> "$report"

          stateless=0
          denied=0

          for rule in $RULES; do
            # A rule that cannot be read is a real finding, not a reason to
            # abort the loop: report every rule, then decide what it means.
            if ! json=$(az monitor scheduled-query show -n "$rule" -g "$RG" -o json 2>"$err"); then
              reason=$(tr -d '\r' < "$err" | tr '\n' ' ' | cut -c1-200)
              # AuthorizationFailed and ResourceNotFound are OPPOSITE
              # diagnoses. Never collapse them into one label again.
              case "$reason" in
                *AuthorizationFailed*|*does\ not\ have\ authorization*|*Forbidden*)
                  label="**NOT AUTHORIZED**"; denied=1 ;;
                *ResourceNotFound*|*ResourceGroupNotFound*|*was\ not\ found*)
                  label="**NOT FOUND**" ;;
                *)
                  label="**READ FAILED**" ;;
              esac
              echo "| \`$rule\` | $label | — | — | — | — |" >> "$report"
              echo "::warning title=$rule::$reason"
              stateless=1
              continue
            fi

            read -r am mad freq win sev < <(echo "$json" | jq -r '
              [ (.autoMitigate|tostring),
                (.muteActionsDuration // "—"),
                (.evaluationFrequency // "—"),
                (.windowSize // "—"),
                (.severity|tostring)
              ] | @tsv' | tr '\t' ' ')

            mark="✅"
            if [ "$am" != "true" ]; then mark="❌"; stateless=1; fi
            echo "| \`$rule\` | $mark \`$am\` | \`$mad\` | \`$freq\` | \`$win\` | $sev |" >> "$report"
          done

          {
            echo
            if [ "$stateless" -eq 0 ]; then
              echo "**All three rules are stateful.** Each fires once per condition and sends a single Resolved mail — ADR 0022 decision 6 is live."
            elif [ "$denied" -eq 1 ]; then
              echo "**This identity may not read the alert rules, so their state is unknown.** The \`Monitoring Reader\` grant in \`infra/oidc.tf\` comes from the same apply that carries \`auto_mitigation_enabled\`, so the most likely explanation is that the apply has not landed. Confirm the run in the \`hcw-azure\` workspace, then re-run this workflow."
            else
              echo "**At least one rule is still stateless, or could not be read.** A stateless rule re-notifies on every evaluation whose condition is met — at PT5M that is a fresh mail every five to ten minutes."
            fi
          } >> "$report"

          # Both destinations, deliberately: the summary is for a human on a
          # phone, stdout is for the logs API. See the header.
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

          exit "$stateless"
