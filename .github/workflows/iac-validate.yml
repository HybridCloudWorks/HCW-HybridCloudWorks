# Credential-free validation gate for infra/**.
#
# This is deliberately NOT a delivery workflow (same doctrine as ci.yml): no
# secrets, no cloud credentials, no state access. `terraform init
# -backend=false` installs providers without touching the HCP Terraform Cloud
# workspace, so every check here is safe on any pull request.
#
# It exists because the prototype deploy workflow is hard-disabled, which left
# infra/** with no validation at all — a formatting error or invalid resource
# block would only surface at the next human-driven TFC run.
#
# WHY THE pull_request TRIGGER IS NOT PATH-FILTERED (T-523).
#
# Both jobs here are meant to be REQUIRED to merge on the `main` ruleset. A
# required context whose workflow was filtered out is not auto-satisfied by
# GitHub: the pull request sits at "Expected — waiting for status to be
# reported" indefinitely. With `paths: infra/**` on the trigger, that would
# describe every pull request that does not touch infra/, which is most of
# them — a self-inflicted outage on the merge queue.
#
# So the trigger fires on every pull request and the FILTERING MOVED INSIDE:
# each job checks out, decides whether infra/** actually changed, and skips its
# expensive steps when it did not. The job itself still completes and posts its
# context, which is what the ruleset needs. Cost when nothing infra changed is
# a checkout and one `git diff` per job.
#
# The `push` trigger keeps its path filter — required contexts are a pull
# request concern, and there is nothing to satisfy on a branch push.
#
# Do not re-add `paths:` to `pull_request` without first removing the two
# contexts from the ruleset, in that order.

name: IaC Validation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  contents: read

concurrency:
  group: iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      # fetch-depth: 0 so the change detection below can diff against the base
      # commit. A shallow clone does not contain it, and `git diff` against a
      # sha it does not have fails rather than returning "no changes" — which
      # would silently skip the checks on a real infra change.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Non-pull_request events reach here only through the path-filtered push
      # trigger, so they are infra changes by construction and run everything.
      - name: Detect infra changes
        id: changes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip required work. A diff that
          # cannot be computed fails toward running everything. (Found by
          # review on #319, which copied this step's original form.)
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)" || {
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          if grep -qE '^(infra/|\.github/workflows/iac-validate\.yml$)' <<<"$changed"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "infra/ changed — running all checks"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "no infra/ change — skipping checks, still reporting this context"
          fi

      - name: Setup Terraform
        if: steps.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt
        if: steps.changes.outputs.infra == 'true'
        run: terraform fmt -recursive -check -diff

      - name: Terraform init (no backend)
        if: steps.changes.outputs.infra == 'true'
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        if: steps.changes.outputs.infra == 'true'
        run: terraform validate -no-color

      - name: Setup tflint
        if: steps.changes.outputs.infra == 'true'
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: tflint
        if: steps.changes.outputs.infra == 'true'
        run: |
          tflint --init
          tflint --format compact
        env:
          # Raises the anonymous GitHub API rate limit for plugin download.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy IaC misconfiguration scan
    runs-on: ubuntu-latest
    env:
      # v0.69.3 is the latest release named safe by Aqua's 2026-03-19 security
      # advisory (github.com/aquasecurity/trivy/discussions/10425): the
      # trivy-action git tags were re-pointed to malicious commits (which is
      # why the original `aquasecurity/trivy-action@0.28.0` pin stopped
      # resolving), and the v0.69.4 binary release was itself malicious. So:
      # no marketplace action, a version-pinned binary from the project's own
      # releases, verified against the release's checksum manifest. When
      # bumping, re-check the advisory thread first, and prefer embedding the
      # tarball's sha256 directly here over trusting the manifest (T-501's
      # supply-chain posture).
      TRIVY_VERSION: 0.69.3
      # sha256 of trivy_0.69.3_Linux-64bit.tar.gz, verified against the release
      # manifest on 2026-08-28 and pinned here so later runs do not re-trust the
      # origin they are verifying (T-755). Bump this in the same commit as
      # TRIVY_VERSION — a mismatch fails the install step loudly, which is the
      # intended behaviour.
      TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect infra changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running the scan"
            exit 0
          fi
          # Capture the diff first — same reasoning as the terraform job's
          # detect step: a failed diff must fail toward running, not skipping.
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)" || {
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running the scan rather than guessing"
            exit 0
          }
          if grep -qE '^(infra/|\.github/workflows/iac-validate\.yml$)' <<<"$changed"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "infra/ changed — running the scan"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "no infra/ change — skipping the scan, still reporting this context"
          fi

      - name: Install Trivy (pinned release binary)
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # Keep the release's own filename: the checksum manifest lists it by
          # that name, so sha256sum -c can match it.
          curl -sSfL -o "/tmp/${tarball}" "${base}/${tarball}"
          # The expected digest is pinned HERE, in the repository, not fetched
          # from the same release that serves the tarball (T-755). Downloading
          # the manifest from the origin it verifies means an attacker who can
          # re-point the release controls both halves — which is exactly the
          # trivy-action compromise the comment above this step describes.
          # Update this literal in the same commit as TRIVY_VERSION.
          echo "${TRIVY_SHA256}  ${tarball}" > /tmp/trivy_expected.txt
          (cd /tmp && sha256sum -c trivy_expected.txt)
          tar -xzf "/tmp/${tarball}" -C /tmp trivy
          install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # HIGH/CRITICAL fail the gate; MEDIUM and below are reported in the log
      # only — tighten once the existing configuration is clean at that level.
      - name: Scan infra/
        if: steps.changes.outputs.infra == 'true'
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL infra
