# Build-and-test gate for pull requests.
#
# This is deliberately NOT a delivery workflow: it uses no secrets, no cloud
# credentials, and no OIDC. It only installs, builds, and runs unit tests, so
# it is safe to run on every pull request while the prototype delivery jobs
# stay disabled pending baseline hardening.
#
# It exists because dependency pull requests previously had nothing validating
# them — `npm ci` alone catches the most common failure mode, a package.json
# and package-lock.json that disagree.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    # Runner selection is a repository variable so CI can fail over to the
    # self-hosted Azure runners (infra/ci-runner.tf) during a GitHub-hosted
    # runner outage without a code change:
    #   unset / 'ubuntu-latest'  -> GitHub-hosted (normal operation)
    #   '["self-hosted","aca"]'  -> Azure Container Apps runners (fallback)
    # GitHub has no automatic runs-on failover; flipping CI_RUNNER applies to
    # all runs created after the change. See Review.md §4.4 for the runbook.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    strategy:
      # One package failing should not mask the state of the others.
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dir: frontend
            # test:admin includes functions/cms-functions.test.js, which imports
            # firebase-functions from the sibling frontend/functions package.
            # Without its node_modules the suite fails on a missing module.
            extra_install: frontend/functions
            lint: npm run lint
            format: npm run format:check
            build: npm run build
            test: npm run test:admin
          - name: functions (azure)
            dir: functions
            test: npm test
          - name: scripts (migration)
            dir: scripts
            test: npm test
          - name: frontend/functions (legacy)
            dir: frontend/functions
          # frontend/scripts is intentionally absent: its package.json is a
          # CommonJS boundary marker with no dependencies, so there is no
          # lockfile to keep honest and nothing to install.
          - name: frontend/labs/vps-agent
            dir: frontend/labs/vps-agent
          - name: vps-agent
            dir: vps-agent

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      # `npm ci` is the point of this job for packages with no tests: it fails
      # when the lockfile is out of sync with package.json, which is exactly
      # how a bad dependency bump shows up.
      - name: Install (lockfile-strict)
        run: npm ci

      - name: Install sibling package required by tests
        if: matrix.extra_install != ''
        working-directory: ${{ matrix.extra_install }}
        run: npm ci

      # Lint and format run before the build so style feedback arrives fast.
      # `npm run lint` exits non-zero only on errors, not warnings, so the 19
      # pre-existing warnings do not fail the job.
      - name: Lint
        if: matrix.lint != ''
        run: ${{ matrix.lint }}

      - name: Format check
        if: matrix.format != ''
        run: ${{ matrix.format }}

      - name: Build
        if: matrix.build != ''
        run: ${{ matrix.build }}

      - name: Test
        if: matrix.test != ''
        run: ${{ matrix.test }}
