# Firestore → Cosmos DB and Firebase Storage → Blob, rehearsed and verified.
#
# Dispatch only. Every mode is read-only against Firestore and GCS. Against
# Cosmos and Blob, every mode is read-only EXCEPT `rehearse` and
# `storage-rehearse`, and those refuse `target=production` outright (the guard
# step below). Production writes are a later phase, opened by flipping
# `migration_writer_enabled` in Terraform — until then the deploy identity
# holds no write role on production, so this file's guard is the second lock,
# not the only one.
#
# THREE THINGS THIS WORKFLOW NEVER DOES, because the repository is public and
# its job logs and artifacts are world-readable:
#   1. upload the export. It lives in $RUNNER_TEMP and dies with the runner.
#   2. upload a full report. Only *.summary.json files — counts, container
#      names, warning tallies — are artifacts. The scripts write the full
#      reports (document ids, field previews, object paths) beside them and
#      those stay on the runner.
#   3. print a document sample. MIGRATION_CI=1 makes --show-samples an error.
#
# Credentials: none stored. Firestore/GCS through GCP Workload Identity
# Federation (google-github-actions/auth), Azure through the
# `environment:data-migration` federated credential on the deploy identity.
# There is no service-account key and no COSMOS_KEY, and both would be refused
# by the scripts if present.
#
# Step ORDER is a correctness constraint, not style: the GitHub OIDC token
# the GCP auth step exchanges lives for five minutes. Everything slow — npm ci,
# the Site-Main checkout, the Cosmos probe — runs BEFORE that step, so the
# token is fresh when the first Firestore read mints the access token.

name: Migrate data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        type: choice
        default: preflight
        options:
          - preflight # read-only Firestore inventory; exit 2 on unmanifested collections
          - inventory-gate # Site-Main's own `inventory-collections --diff` against our manifest
          - export-dry-run # export to the runner's temp dir and discard — proves WIF + transform
          - rehearse # export → import --dry-run → import → verify, against `target` (scratch only)
          - verify # re-export and reconcile against `target`; read-only on both sides
          - storage-inventory # list the GCS bucket by prefix; exit 2 on unmanifested prefixes
          - storage-rehearse # copy + verify into `target` storage (scratch only)
      target:
        description: 'Which Cosmos / storage account'
        required: true
        type: choice
        default: scratch
        options:
          - scratch
          - production
      collections:
        description: 'Comma-separated containers to restrict to (blank = all)'
        required: false
        type: string
      prefixes:
        description: 'Comma-separated GCS prefixes to restrict storage modes to (blank = all)'
        required: false
        type: string
      site_main_ref:
        description: 'Site-Main ref for inventory-gate'
        required: false
        type: string
        default: main

# Never two runs writing to the same account at once. Never cancelled mid-copy.
concurrency:
  group: data-migration
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    # The environment name is load-bearing: infra/oidc.tf pins a federated
    # credential to subject `repo:<org>/<repo>:environment:data-migration`.
    # Rename it and Azure Login fails with AADSTS70021.
    environment: data-migration
    timeout-minutes: 50

    env:
      MODE: ${{ inputs.mode }}
      TARGET: ${{ inputs.target }}
      COLLECTIONS: ${{ inputs.collections }}
      PREFIXES: ${{ inputs.prefixes }}
      COSMOS_DATABASE: hcw
      MIGRATION_CI: '1'

    steps:
      # ---------------------------------------------------------------------
      # Guards first, before anything costs time or touches a credential.
      # ---------------------------------------------------------------------
      - name: Refuse write modes against production
        if: ${{ inputs.target == 'production' && (inputs.mode == 'rehearse' || inputs.mode == 'storage-rehearse') }}
        run: |
          echo "::error::'${MODE}' writes to the target, and target=production is not enabled in this phase."
          echo "::error::Production writes are opened by migration_writer_enabled=true in Terraform (infra/variables.tf), after the scratch rehearsal is signed off."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Check the generated container spec is current
        working-directory: scripts
        run: node generate-cosmos-container-spec.mjs --check

      # ---------------------------------------------------------------------
      # Resolve the target. Endpoints are repository VARIABLES (they are public
      # URLs, not secrets); both come from Terraform outputs via
      # scripts/set-github-variables.ps1.
      # ---------------------------------------------------------------------
      - name: Resolve target endpoints
        id: target
        env:
          COSMOS_PROD: ${{ vars.COSMOS_ENDPOINT }}
          COSMOS_SCRATCH: ${{ vars.COSMOS_SCRATCH_ENDPOINT }}
          STORAGE_PROD: ${{ vars.STORAGE_ACCOUNT }}
          STORAGE_SCRATCH: ${{ vars.STORAGE_SCRATCH_ACCOUNT }}
          RG_PROD: ${{ vars.STORAGE_RESOURCE_GROUP }}
          RG_SCRATCH: ${{ vars.SCRATCH_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            cosmos="$COSMOS_PROD"; storage="$STORAGE_PROD"; rg="$RG_PROD"
          else
            cosmos="$COSMOS_SCRATCH"; storage="$STORAGE_SCRATCH"; rg="$RG_SCRATCH"
          fi
          case "$MODE" in
            rehearse|verify)
              [ -n "$cosmos" ] || { echo "::error::No Cosmos endpoint variable for target=$TARGET — run scripts/set-github-variables.ps1 after the scratch apply."; exit 1; } ;;
            storage-rehearse)
              [ -n "$storage" ] && [ -n "$rg" ] || { echo "::error::No storage account / resource group variable for target=$TARGET."; exit 1; } ;;
          esac
          echo "cosmos=$cosmos" >> "$GITHUB_OUTPUT"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "rg=$rg" >> "$GITHUB_OUTPUT"
          echo "Target $TARGET → cosmos=${cosmos:-n/a} storage=${storage:-n/a}"

      # ---------------------------------------------------------------------
      # Site-Main, for the inventory gate only. Private repository: the token
      # comes from an org GitHub App with contents:read on Site-Main alone (no
      # human-expiry PAT). Falls back to SITE_MAIN_READ_TOKEN if the App is
      # not configured — recorded in REVIEW §4.3 with its expiry.
      # ---------------------------------------------------------------------
      - name: Mint a read token for Site-Main
        if: ${{ inputs.mode == 'inventory-gate' && vars.SITE_MAIN_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SITE_MAIN_APP_ID }}
          private-key: ${{ secrets.SITE_MAIN_APP_PRIVATE_KEY }}
          owner: HybridCloudWorks
          repositories: Site-Main

      - name: Check out Site-Main
        if: ${{ inputs.mode == 'inventory-gate' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HybridCloudWorks/Site-Main
          ref: ${{ inputs.site_main_ref }}
          path: site-main
          token: ${{ steps.app-token.outputs.token || secrets.SITE_MAIN_READ_TOKEN }}

      # ---------------------------------------------------------------------
      # Azure, then the Cosmos probe — BEFORE the GCP token is minted.
      # ---------------------------------------------------------------------
      - name: Azure Login
        if: ${{ contains(fromJSON('["rehearse","verify","storage-rehearse"]'), inputs.mode) }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      # One read. A 403 from Cosmos has two unrelated causes — the runner is
      # not admitted by the firewall, or the identity reached Cosmos and lacks
      # a database-scope role — and the export would otherwise run to
      # completion before the import failed on the first upsert with an error
      # naming neither. The probe fails here, first, and says which.
      - name: Probe Cosmos reachability and authorization
        if: ${{ contains(fromJSON('["rehearse","verify"]'), inputs.mode) }}
        working-directory: scripts
        env:
          COSMOS_ENDPOINT: ${{ steps.target.outputs.cosmos }}
        run: node migration-probe.mjs --container content

      # The runner has a public dynamic IP and the storage account denies by
      # default: open a window, close it in an always() step. Same pattern as
      # deploy-functions.yml for the Functions host account.
      - name: Open storage firewall window for this runner
        if: ${{ inputs.mode == 'storage-rehearse' }}
        id: fw
        env:
          RG: ${{ steps.target.outputs.rg }}
          ACCOUNT: ${{ steps.target.outputs.storage }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sS --max-time 10 https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          az storage account network-rule add \
            --resource-group "$RG" --account-name "$ACCOUNT" \
            --ip-address "$RUNNER_IP" --output none
          sleep 30

      # ---------------------------------------------------------------------
      # GCP — last before first use. Writes an external_account credential
      # file and exports GOOGLE_APPLICATION_CREDENTIALS; firebase-admin and
      # @google-cloud/storage pick it up through Application Default
      # Credentials. The action's post-step deletes the file.
      # ---------------------------------------------------------------------
      - name: Authenticate to GCP (Workload Identity Federation)
        if: ${{ inputs.mode != 'inventory-gate' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      # ---------------------------------------------------------------------
      # The work. Inputs arrive through env, never interpolated into the
      # shell — an input in a `run:` string is a script-injection vector.
      # ---------------------------------------------------------------------
      - name: Run the migration tooling
        working-directory: scripts
        env:
          COSMOS_ENDPOINT: ${{ steps.target.outputs.cosmos }}
          STORAGE_ACCOUNT: ${{ steps.target.outputs.storage }}
        run: |
          set -euo pipefail

          scope=()
          [ -n "$COLLECTIONS" ] && scope=(--collections "$COLLECTIONS")
          pscope=()
          [ -n "$PREFIXES" ] && pscope=(--prefixes "$PREFIXES")

          # The export never leaves the runner.
          export_dir="$RUNNER_TEMP/export"

          case "$MODE" in
            preflight)
              node preflight-firestore-inventory.mjs
              ;;
            inventory-gate)
              sha=$(git -C ../site-main rev-parse HEAD)
              echo "Site-Main @ $sha"
              mkdir -p reports
              node ../site-main/scripts/inventory-collections.mjs --diff ./lib/migration-manifest.mjs | tee reports/inventory-diff.txt
              printf '{"generatedAt":"%s","siteMainSha":"%s","passed":true}\n' "$(date -u +%FT%TZ)" "$sha" > reports/inventory-diff.summary.json
              ;;
            export-dry-run)
              node migrate-firestore-to-cosmos.mjs --export --out "$export_dir" "${scope[@]}"
              ;;
            rehearse)
              node migrate-firestore-to-cosmos.mjs --export --out "$export_dir" "${scope[@]}"
              node migrate-firestore-to-cosmos.mjs --import --from "$export_dir" --dry-run "${scope[@]}"
              node migrate-firestore-to-cosmos.mjs --import --from "$export_dir" --concurrency 4 "${scope[@]}"
              node verify-migration.mjs --from "$export_dir" "${scope[@]}"
              ;;
            verify)
              node migrate-firestore-to-cosmos.mjs --export --out "$export_dir" "${scope[@]}"
              node verify-migration.mjs --from "$export_dir" "${scope[@]}"
              ;;
            storage-inventory)
              node migrate-storage-to-blob.mjs --inventory
              ;;
            storage-rehearse)
              node migrate-storage-to-blob.mjs --copy --dry-run "${pscope[@]}"
              node migrate-storage-to-blob.mjs --copy "${pscope[@]}"
              node migrate-storage-to-blob.mjs --verify "${pscope[@]}"
              ;;
            *)
              echo "::error::Unknown mode: $MODE"; exit 1 ;;
          esac

      - name: Close storage firewall window
        if: ${{ always() && steps.fw.outputs.runner_ip != '' }}
        env:
          RG: ${{ steps.target.outputs.rg }}
          ACCOUNT: ${{ steps.target.outputs.storage }}
        run: |
          az storage account network-rule remove \
            --resource-group "$RG" --account-name "$ACCOUNT" \
            --ip-address "${{ steps.fw.outputs.runner_ip }}" --output none

      # Summaries only. Full reports carry document ids, field previews and
      # object paths; on a public repository an artifact is a publication.
      - name: Collect publishable summaries
        if: always()
        working-directory: scripts
        run: |
          mkdir -p "$RUNNER_TEMP/summaries"
          find reports -maxdepth 1 \( -name '*.summary.json' -o -name 'inventory-diff.txt' \) -exec cp {} "$RUNNER_TEMP/summaries/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/summaries" || true
          # Belt and braces: refuse to upload anything that looks like a full report.
          if ls "$RUNNER_TEMP"/summaries/*.json 2>/dev/null | grep -v '\.summary\.json$' ; then
            echo "::error::A non-summary report reached the upload set"; exit 1
          fi
          {
            echo "## Migrate data — \`$MODE\` against \`$TARGET\`"
            echo
            for f in "$RUNNER_TEMP"/summaries/*.summary.json; do
              [ -f "$f" ] || continue
              echo "<details><summary>$(basename "$f")</summary>"; echo; echo '```json'; cat "$f"; echo '```'; echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-summaries-${{ inputs.mode }}-${{ inputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/summaries/
          retention-days: 1
          if-no-files-found: ignore
