# Gated infrastructure delivery — DISABLED until production applies are
# authorized (root README: "Production deployment: not authorized").
#
# This replaces the prototype workflow, which had three defects worth not
# resurrecting: it applied with -auto-approve on every push to main, it
# authenticated with a long-lived TF_API_TOKEN repository secret, and its plan
# ran with continue-on-error so a failed plan could still comment success.
#
# The model here, once enabled:
#   - Trigger is workflow_dispatch ONLY. Nothing applies because a commit
#     landed; a human starts every run.
#   - The job runs in the `production-infra` GitHub Environment. Configure
#     required reviewers on that environment so a second person approves the
#     run before it starts, and scope any secret to it.
#   - Plan and apply execute IN HCP Terraform Cloud (backend.tf); the workspace
#     holds credentials and variables. This job only starts the run and
#     surfaces the link — it never holds Azure credentials itself.
#   - HCP Terraform's own "confirm & apply" remains on, so the plan is
#     reviewed where the state lives, not in a PR comment.
#
# TO ENABLE (deliberate, two-line change, requires README status change too):
#   1. Flip `if: ${{ false }}` to `if: ${{ true }}` in a reviewed PR.
#   2. Create the `production-infra` environment with required reviewers and
#      a TFC team token scoped to the workspace as TF_API_TOKEN.
# See the Wiki Deployment Runbook for the full procedure and preconditions.

name: DISABLED - Gated Infrastructure Delivery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "plan" to start an HCP Terraform run (apply is confirmed in TFC, not here)'
        required: true

permissions:
  contents: read

jobs:
  terraform-run:
    if: ${{ false }}
    name: Start HCP Terraform run
    runs-on: ubuntu-latest
    environment: production-infra
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Refuse unconfirmed dispatch
        if: ${{ github.event.inputs.confirm != 'plan' }}
        run: |
          echo 'Dispatch input was not "plan"; refusing to start a run.'
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        run: terraform fmt -recursive -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan (remote run)
        run: terraform plan -no-color -input=false
        # The plan executes in the HCP Terraform workspace. Apply is NOT run
        # from this job: confirm it in the TFC UI after review, per runbook.
