name: Deploy Frontend

# ENABLED 2026-08-22 for Migration_Plan §6 step 1. Dispatch-only, for the same
# reason deploy-functions.yml is: enabling a workflow and enabling
# auto-deploy-on-merge are two separate decisions, and only the first has been
# made. Restore the push trigger once a dispatch run has succeeded end to end
# and someone has looked at the site — not before, because a red auto-deploy on
# main is discovered by whoever next visits it.
#
# THE FIRST RUN DOES NOT TOUCH VISITORS. It publishes to the Static Web App's
# own calm-ground-0d0e6a010.7.azurestaticapps.net hostname, which is the §6
# step 2 preview host. DNS still points at Firebase and does not move until §6
# step 5, so this is safe to run while Firebase is live — and running the two
# in parallel on that hostname is the point of step 2.
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'frontend/**'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate public data (certifications, speakerevents)
        run: npm run build:data
        env:
          # Data generation reads from the API — no direct Cosmos access from CI.
          # FUNCTIONS_URL is a repository VARIABLE (a public API base URL, not a
          # secret), named per the variable standard: 2 words, no provider prefix.
          AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}

      - name: Build
        run: npm run build
        env:
          # Fails the build rather than shipping a bundle with no API base.
          REQUIRE_API_BASE: 'true'
          # Must include the Functions route prefix, e.g. https://<host>/api,
          # or "/api" when the SPA and the Function App share an origin.
          VITE_AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}
          # Entra ID — public client registration values (not secrets)
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          # Without this the SPA requests a token the backend rejects on
          # audience: sign-in succeeds and every API call 401s (REVIEW §2.2).
          # msalConfig.js defaults it to '' — the build does not fail.
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          # Social URLs — public, non-sensitive
          VITE_SOCIAL_X_URL: ${{ vars.VITE_SOCIAL_X_URL }}
          VITE_SOCIAL_LINKEDIN_URL: ${{ vars.VITE_SOCIAL_LINKEDIN_URL }}
          VITE_SOCIAL_GITHUB_URL: ${{ vars.VITE_SOCIAL_GITHUB_URL }}
          # NOTE: VITE_COSMOS_* vars are intentionally absent.
          # The frontend never accesses Cosmos directly — all data goes through the API.

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
          # No skip_api_build here: it is not an input at the pinned action SHA,
          # and with no api_location set there is no API build to skip anyway.
