name: DISABLED - Prototype Frontend Deployment

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: ${{ false }}
    name: Build and Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate public data (certifications, speakerevents)
        run: npm run build:data
        env:
          # Use Azure Cosmos DB for build-time data generation
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          COSMOS_DATABASE: hybridcloudworks

      - name: Build
        run: npm run build
        env:
          # Backend provider toggle — set to 'azure' post-migration
          VITE_BACKEND_PROVIDER: azure
          # Azure configuration
          VITE_AZURE_FUNCTIONS_URL: ${{ secrets.AZURE_FUNCTIONS_URL }}
          VITE_COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          VITE_COSMOS_READ_KEY: ${{ secrets.COSMOS_READ_KEY }}
          VITE_COSMOS_DATABASE: hybridcloudworks
          # Entra ID Auth
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
          # Admin identity
          VITE_OWNER_ADMIN_EMAIL: ${{ secrets.VITE_OWNER_ADMIN_EMAIL }}
          VITE_OWNER_ADMIN_UID: ${{ secrets.VITE_OWNER_ADMIN_UID }}
          # Social URLs
          VITE_SOCIAL_X_URL: ${{ vars.VITE_SOCIAL_X_URL }}
          VITE_SOCIAL_LINKEDIN_URL: ${{ vars.VITE_SOCIAL_LINKEDIN_URL }}
          VITE_SOCIAL_GITHUB_URL: ${{ vars.VITE_SOCIAL_GITHUB_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
          skip_api_build: true
