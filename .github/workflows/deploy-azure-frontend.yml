name: Deploy Frontend

# Manual release workflow for the public website. It remains dispatch-only so a
# human can choose when the Static Web App receives a build; automatic deploys
# can be enabled separately after the release process is formally approved.
#
# The workflow publishes to the Static Web App hostname configured in Azure;
# DNS and custom-domain changes are separate infrastructure decisions.
#
# ============================================================================
# ROLLBACK (T-729)
# ============================================================================
# There is no "redeploy the previous version" button. Static Web Apps keeps no
# addressable history of uploads for this SKU, and the upload here replaces the
# content root wholesale. So rollback is a FORWARD deploy of known-good code,
# and it has one non-obvious constraint worth knowing before you need it:
#
#   **You cannot roll back by dispatching an older ref.** The T-705 guard below
#   refuses any ref but `main`, deliberately — that guard is what stops an
#   unreviewed branch shipping to production past the required checks. It
#   applies to a rollback dispatch exactly as it applies to a bad one.
#
# The procedure is therefore:
#
#   1. `git revert <bad commit>` on a branch, open a PR, let CI run.
#   2. Merge it. Reverting through the normal gate is the point: a rollback is
#      a production change and gets the same review as any other.
#   3. Dispatch this workflow from `main`.
#
# If the estate is unserviceable and step 1-2 is too slow, the escape hatch is
# an owner one and lives outside this repository: Azure Portal → the Static Web
# App → re-point or disable the custom domain. That is a decision with DNS
# consequences, which is why it is not automated here.
#
# **Not automated, and why.** The obvious automation — a post-deploy HTTP check
# that triggers a re-deploy of the previous commit — cannot be written honestly
# today. A GitHub-hosted runner asking `https://hybridcloudworks.com` is a
# datacenter client, and Cloudflare's Bot Fight Mode answers those with a 403
# interstitial; that is the whole reason the availability test is disarmed and
# ADR 0024 routes around it with a Worker (T-519). A smoke step written
# against the public host would fail on a healthy deploy and trigger a rollback
# of good code, which is worse than having no smoke step. The revisit
# precondition is now met — the Worker was deployed and its alert armed on
# 2026-09-01 — so asking the probe's availabilityResults instead of the public
# host is available; wiring that is a deliberate owner decision, not assumed
# here.
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'frontend/**'
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy to the Static Web App at a time (T-729). `deploy-functions.yml`
# has always had this; the frontend did not, so two overlapping dispatches
# raced the upload with nondeterministic last-writer-wins — and because the
# upload is not atomic, the losing run could interleave rather than simply be
# overwritten, leaving a mix of two builds served.
#
# `cancel-in-progress: false`, matching the functions deploy: cancelling a
# deploy part-way through leaves the target in exactly the half-written state
# the group exists to prevent. Queue instead.
concurrency:
  group: swa-deploy
  cancel-in-progress: false

# ============================================================================
# WHY THIS IS TWO JOBS (T-727)
# ============================================================================
# The deployment token used to be `AZURE_STATIC_WEB_APPS_API_TOKEN`, a stored
# non-expiring GitHub secret, and it lived in the same job that had just run
# `npm ci` and executed the whole frontend dependency tree. A compromised build
# dependency had it in reach, and exfiltrating it granted standing ability to
# publish arbitrary content to the public site until a human noticed and
# rotated it.
#
# Two changes, in that order, and the split still matters after the second.
#
# The split came first: `build` installs, builds and verifies and holds NO
# secret; `deploy` installs nothing and only downloads the verified output and
# uploads it. A compromised build dependency can still poison this deploy's
# content — it produced it — but it cannot take the credential and publish
# again tomorrow, which is the harm the finding names.
#
# THE STORED SECRET IS NOW GONE (T-727, 2026-08-30). `deploy` mints the token
# from ARM under federated identity and it lives for one run. That does not
# make the split redundant: a token in a job that installs nothing is reachable
# only by this workflow's own steps, while the same token in the build job
# would be reachable by every transitive dependency for the length of the
# install. Ephemeral and unreachable are different properties, and this keeps
# both.
#
# What did NOT change: the token still exists in Terraform state as an
# attribute of azurerm_static_web_app.hcw. infra/outputs.tf says so where the
# output used to be.
#
# The `production` environment binding moves to `deploy`, which is the job that
# actually touches production — and it is where an approval gate belongs, since
# an approval that fires before the build is an approval of nothing.
#
# STILL OPEN, and owner-gated: moving the SWA deploy to OIDC entirely, which
# would remove the credential rather than isolate it, and storing this secret
# as an ENVIRONMENT secret on a protected `production` rather than a repository
# secret. Both need repository-admin and Azure access. Tracked in TODO.md.
jobs:
  build:
    name: Build and verify the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Refuse a deploy from a ref that is not main
        # The `production` environment records who deployed but does not gate
        # whether they may: GitHub auto-creates a missing environment with no
        # protection rules, and the federated credential's subject is
        # environment-scoped, so it matches from ANY branch. Without this step
        # a dispatch from an unreviewed ref ships to production past all 12
        # required contexts (T-705). This is the repository-side half; the
        # durable fix is required reviewers plus a main-only branch
        # restriction on the environment itself, which only a repo admin can
        # configure.
        if: github.ref != 'refs/heads/main'
        # Overrides the job's `working-directory: frontend`: this step runs
        # before checkout, so that directory does not exist yet.
        working-directory: .
        run: |
          echo "::error::Refusing to deploy from ${{ github.ref }}. Production deploys run from main only."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate public data (certifications, speakerevents)
        run: npm run build:data
        env:
          # Data generation reads from the API — no direct Cosmos access from CI.
          # FUNCTIONS_URL is a repository VARIABLE (a public API base URL, not a
          # secret), named per the variable standard: 2 words, no provider prefix.
          AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}

      - name: Build
        run: npm run build
        env:
          # Fails the build rather than shipping a bundle with no API base.
          REQUIRE_API_BASE: 'true'
          # Must include the Functions route prefix, e.g. https://<host>/api,
          # or "/api" when the SPA and the Function App share an origin.
          VITE_AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}
          # Entra ID — public client registration values (not secrets)
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          # Without this the SPA requests a token the backend rejects on
          # audience: sign-in succeeds and every API call 401s (TODO.md).
          # msalConfig.js defaults it to '' — the build does not fail.
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          # Social URLs — public, non-sensitive
          VITE_SOCIAL_X_URL: ${{ vars.VITE_SOCIAL_X_URL }}
          VITE_SOCIAL_LINKEDIN_URL: ${{ vars.VITE_SOCIAL_LINKEDIN_URL }}
          VITE_SOCIAL_GITHUB_URL: ${{ vars.VITE_SOCIAL_GITHUB_URL }}
          # NOTE: VITE_COSMOS_* vars are intentionally absent.
          # The frontend never accesses Cosmos directly — all data goes through the API.

      # The build output must be complete and must be the ONLY thing uploaded.
      # The first run of this workflow failed with "The size of the app content
      # was too large. The limit for this Static Web App is 524288000 bytes":
      # with `skip_app_build: true` the action uploads `app_location` itself, so
      # pointing it at `frontend` sent 1.4 GB — 927 MB of which was
      # node_modules. `dist` is 112 MB.
      - name: Verify the upload payload
        run: |
          set -euo pipefail
          test -f dist/staticwebapp.config.json || {
            echo "::error::dist/staticwebapp.config.json is missing. Without it the site loads, the home page works, and every deep link 404s — see frontend/scripts/stage-swa-config.mjs."
            exit 1
          }
          test -f dist/index.html || { echo "::error::dist/index.html is missing; the build did not produce a site."; exit 1; }

          # A shell builds cleanly, passes component tests, and can look correct
          # in a browser while crawlers receive no page content. Assert the
          # rendered document count here rather than leaving that to discovery.
          # `npm run build` runs scripts/prerender.mjs, which writes ~80.
          html=$(find dist -name '*.html' | wc -l)
          echo "dist contains $html HTML documents"
          [ "$html" -ge 60 ] || {
            echo "::error::only $html HTML documents in dist — pre-rendering did not run or mostly failed. See frontend/scripts/prerender.mjs."
            exit 1
          }
          # The pattern is MOUNT_POINT_PATTERN in frontend/scripts/prerender.mjs
          # and prerender.test.js reads it back out of THIS FILE to assert the
          # two still agree. Change one and the frontend test job fails.
          #
          # It was `<div id="root"><[^/]` until 2026-09-01, written when the
          # mount point carried no attributes. #296 added
          # data-prerendered-route and the literal stopped existing, so this
          # check could never pass — and since it BLOCKS rather than admits, it
          # failed every deploy on correctly pre-rendered output instead of
          # being noticed.
          grep -q '<div id="root"[^>]*><[^/]' dist/about/index.html || {
            echo "::error::dist/about/index.html has an empty mount point — it is a shell, not a pre-rendered page."
            exit 1
          }

          # Assert on the BUILT HTML, not the components. The canonical bug got
          # past every unit test precisely because it lived in index.html and
          # was applied by the pre-render step — neither of which a React
          # component test looks at. Every page shipped a canonical pointing at
          # the home page, telling crawlers the whole site was one document.
          # Every page, not a sample: the two-canonical bug appeared only on
          # article detail routes, because those templates render one of their
          # own — a sample of three landing pages would have missed all 24.
          dupes=$(for f in $(find dist -name index.html); do
            n=$(grep -c 'rel="canonical"' "$f" || true); [ "$n" -eq 1 ] || echo "$f:$n";
          done)
          [ -z "$dupes" ] || { echo "::error::pages without exactly one canonical:"; echo "$dupes"; exit 1; }

          for page in about azure/education contact; do
            f="dist/$page/index.html"
            n=$(grep -c 'rel="canonical"' "$f" || true)
            [ "$n" -eq 1 ] || { echo "::error::$f has $n canonical links, expected exactly 1."; exit 1; }
            grep -q "rel=\"canonical\" href=\"https://hybridcloudworks.com/$page\"" "$f" || {
              echo "::error::$f canonical is not https://hybridcloudworks.com/$page/ — $(grep -o 'rel="canonical"[^>]*' "$f")"
              exit 1
            }
            grep -q 'property="og:url"' "$f" || { echo "::error::$f has no og:url."; exit 1; }
          done

          # The sitemap is generated from the routes that were written, so a
          # stale hand-maintained file reappearing is a real regression.
          locs=$(grep -c '<loc>' dist/sitemap.xml || echo 0)
          [ "$locs" -ge 60 ] || { echo "::error::sitemap.xml has only $locs URLs — it was not generated from the pre-render route list."; exit 1; }
          grep -q '<loc>https://hybridcloudworks.com/about</loc>' dist/sitemap.xml || {
            echo "::error::sitemap.xml does not use the canonical (non-trailing) form."
            exit 1
          }
          test -f dist/robots.txt || { echo "::error::dist/robots.txt is missing; navigationFallback excludes it, so crawlers get a 404."; exit 1; }
          echo "metadata contract: canonical, og:url and sitemap verified on built HTML"
          bytes=$(du -sb dist | cut -f1)
          echo "dist: $(du -sh dist | cut -f1) ($bytes bytes), limit 524288000"
          [ "$bytes" -lt 524288000 ] || {
            echo "::error::dist is over the Static Web Apps 500 MB limit at $bytes bytes."
            exit 1
          }

      # Handed to `deploy` instead of being uploaded from here, so the token
      # never shares a job with the dependency tree that produced this (T-727).
      # One day's retention: this is a build artifact, not a release archive,
      # and the rollback path in the header is a forward deploy from main.
      - name: Upload the verified site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error
          # Already-compressed assets; re-compressing 117 MB buys little and
          # costs minutes on both ends.
          compression-level: 1

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build
    runs-on: ubuntu-latest
    # Binding the job to an environment gives production deploys a deployment
    # history and a place to hang an approval gate. It does NOT create the gate
    # on its own: GitHub auto-creates a missing environment with no protection
    # rules, so until required reviewers are configured on the `production`
    # environment this records who deployed without gating whether they may
    # (T-705).
    environment: production
    # id-token for the federated login that mints the deployment token (T-727).
    # `environment: production` above is load-bearing for it: the OIDC subject
    # becomes repo:<org>/<repo>:environment:production, and github_deploy holds
    # exactly that credential plus its immutable form (infra/oidc.tf:153-167).
    # Removing the environment key would break authentication with AADSTS700213,
    # not merely lose the deployment record.
    permissions:
      contents: read
      id-token: write
    steps:
      # The SWA action reads `app_location` from the workspace, so the
      # repository still has to be present — but nothing here installs or runs
      # a dependency.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the verified site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: frontend/dist

      # Cheap re-assertion after the transfer. The build verified this content
      # thoroughly; what is unverified here is that it survived upload and
      # download intact, and deploying an empty directory would succeed and
      # blank the site.
      - name: Confirm the artifact arrived
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html || { echo "::error::artifact is missing index.html"; exit 1; }
          test -f frontend/dist/staticwebapp.config.json || { echo "::error::artifact is missing staticwebapp.config.json — every deep link would 404"; exit 1; }
          html=$(find frontend/dist -name '*.html' | wc -l)
          [ "$html" -ge 60 ] || { echo "::error::only $html HTML documents survived the artifact round trip"; exit 1; }
          echo "artifact intact: $html HTML documents"

      # THE DEPLOYMENT TOKEN IS MINTED HERE, NOT STORED (T-727).
      #
      # Azure/static-web-apps-deploy cannot authenticate with a federated
      # credential — azure/static-web-apps#1304 is an open request for exactly
      # that. So the token is still what the action takes; what changed is that
      # it no longer lives as a long-lived GitHub secret and a Terraform output.
      # It is read from ARM under the same federated identity this repository
      # already uses everywhere else, and it lives for one run.
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Mint the deployment token
        id: swa
        env:
          APP: ${{ vars.STATIC_WEB_APP_NAME || 'stapp-site-prod-cus-01' }}
          RG: ${{ vars.STATIC_WEB_APP_RESOURCE_GROUP || 'rg-web-site-prod-cus' }}
        run: |
          set -uo pipefail

          err=$(mktemp)
          # --query with -o tsv, as deploy-functions.yml already does. The
          # working agreement against `az --query` is about BRACKETS at a
          # PowerShell prompt, where [0] and [?...] get re-parsed; this is bash
          # and a plain property path. It matters here for a second reason: the
          # value must arrive alone, not inside a JSON blob that could be echoed
          # whole before the mask is registered.
          if ! token=$(az staticwebapp secrets list --name "${APP}" --resource-group "${RG}" \
                --query 'properties.apiKey' -o tsv --only-show-errors 2>"${err}"); then
            reason=$(tr -d '\r' < "${err}" | tr '\n' ' ' | cut -c1-300)
            case "${reason}" in
              *AuthorizationFailed*|*does\ not\ have\ authorization*|*Forbidden*)
                echo "::error::Not authorized to list the deployment token. github_deploy needs"
                echo "::error::the 'HCW Static Web App Deployer' role on ${APP}; the definition is"
                echo "::error::in infra/roles/static-web-app-deployer.json and must be created by"
                echo "::error::the owner before the Terraform assignment can be applied." ;;
              *)
                echo "::error::Could not read the deployment token from ARM." ;;
            esac
            echo "Reason: ${reason}"
            exit 1
          fi

          # An empty token is an AUTHORIZED call that returned nothing, which
          # the action would accept and then fail on obscurely. Catch it here,
          # where the cause is still legible.
          if [ -z "${token}" ]; then
            echo "::error::ARM returned an empty deployment token for ${APP}. The call succeeded,"
            echo "::error::so this is not a permissions problem — check the app name."
            exit 1
          fi

          # Registered as a mask BEFORE it is written anywhere, so a later
          # accidental echo of it is redacted rather than published.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
          echo "minted a deployment token for ${APP}"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The BUILT OUTPUT, not the app source. `output_location` is an Oryx
          # build-output path and is ignored when the build is skipped, so it
          # cannot narrow what gets uploaded — `app_location` has to be the
          # content root itself.
          app_location: frontend/dist
          skip_app_build: true
          # No skip_api_build here: it is not an input at the pinned action SHA,
          # and with no api_location set there is no API build to skip anyway.
