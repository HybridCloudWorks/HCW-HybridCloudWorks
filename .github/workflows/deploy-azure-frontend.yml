name: DISABLED - Prototype Frontend Deployment

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: ${{ false }}
    name: Build and Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate public data (certifications, speakerevents)
        run: npm run build:data
        env:
          # Data generation reads from the API — no direct Cosmos access from CI
          AZURE_FUNCTIONS_URL: ${{ secrets.AZURE_FUNCTIONS_URL }}

      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_PROVIDER: azure
          VITE_AZURE_FUNCTIONS_URL: ${{ secrets.AZURE_FUNCTIONS_URL }}
          # Entra ID — public client registration values (not secrets)
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          # Social URLs — public, non-sensitive
          VITE_SOCIAL_X_URL: ${{ vars.VITE_SOCIAL_X_URL }}
          VITE_SOCIAL_LINKEDIN_URL: ${{ vars.VITE_SOCIAL_LINKEDIN_URL }}
          VITE_SOCIAL_GITHUB_URL: ${{ vars.VITE_SOCIAL_GITHUB_URL }}
          # NOTE: VITE_COSMOS_* vars are intentionally absent.
          # The frontend never accesses Cosmos directly — all data goes through the API.

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
          skip_api_build: true
