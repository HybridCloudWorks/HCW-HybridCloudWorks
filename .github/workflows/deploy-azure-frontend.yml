name: Deploy Frontend

# ENABLED 2026-08-22 for Migration_Plan §6 step 1. Dispatch-only, for the same
# reason deploy-functions.yml is: enabling a workflow and enabling
# auto-deploy-on-merge are two separate decisions, and only the first has been
# made. Restore the push trigger once a dispatch run has succeeded end to end
# and someone has looked at the site — not before, because a red auto-deploy on
# main is discovered by whoever next visits it.
#
# THE FIRST RUN DOES NOT TOUCH VISITORS. It publishes to the Static Web App's
# own calm-ground-0d0e6a010.7.azurestaticapps.net hostname, which is the §6
# step 2 preview host. DNS still points at Firebase and does not move until §6
# step 5, so this is safe to run while Firebase is live — and running the two
# in parallel on that hostname is the point of step 2.
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'frontend/**'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate public data (certifications, speakerevents)
        run: npm run build:data
        env:
          # Data generation reads from the API — no direct Cosmos access from CI.
          # FUNCTIONS_URL is a repository VARIABLE (a public API base URL, not a
          # secret), named per the variable standard: 2 words, no provider prefix.
          AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}

      - name: Build
        run: npm run build
        env:
          # Fails the build rather than shipping a bundle with no API base.
          REQUIRE_API_BASE: 'true'
          # Must include the Functions route prefix, e.g. https://<host>/api,
          # or "/api" when the SPA and the Function App share an origin.
          VITE_AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}
          # Entra ID — public client registration values (not secrets)
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          # Without this the SPA requests a token the backend rejects on
          # audience: sign-in succeeds and every API call 401s (REVIEW §2.2).
          # msalConfig.js defaults it to '' — the build does not fail.
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          # Social URLs — public, non-sensitive
          VITE_SOCIAL_X_URL: ${{ vars.VITE_SOCIAL_X_URL }}
          VITE_SOCIAL_LINKEDIN_URL: ${{ vars.VITE_SOCIAL_LINKEDIN_URL }}
          VITE_SOCIAL_GITHUB_URL: ${{ vars.VITE_SOCIAL_GITHUB_URL }}
          # NOTE: VITE_COSMOS_* vars are intentionally absent.
          # The frontend never accesses Cosmos directly — all data goes through the API.

      # The build output must be complete and must be the ONLY thing uploaded.
      # The first run of this workflow failed with "The size of the app content
      # was too large. The limit for this Static Web App is 524288000 bytes":
      # with `skip_app_build: true` the action uploads `app_location` itself, so
      # pointing it at `frontend` sent 1.4 GB — 927 MB of which was
      # node_modules. `dist` is 112 MB.
      - name: Verify the upload payload
        run: |
          set -euo pipefail
          test -f dist/staticwebapp.config.json || {
            echo "::error::dist/staticwebapp.config.json is missing. Without it the site loads, the home page works, and every deep link 404s — see frontend/scripts/stage-swa-config.mjs."
            exit 1
          }
          test -f dist/index.html || { echo "::error::dist/index.html is missing; the build did not produce a site."; exit 1; }

          # The site shipped as a bare SPA shell for the whole migration and
          # nothing noticed: a shell builds cleanly, passes every test, and
          # looks correct in a browser. Only a crawler sees the difference, so
          # the count is asserted here rather than left to be discovered.
          # `npm run build` runs scripts/prerender.mjs, which writes ~80.
          html=$(find dist -name '*.html' | wc -l)
          echo "dist contains $html HTML documents"
          [ "$html" -ge 60 ] || {
            echo "::error::only $html HTML documents in dist — pre-rendering did not run or mostly failed. See frontend/scripts/prerender.mjs (T-515)."
            exit 1
          }
          grep -q '<div id="root"><[^/]' dist/about/index.html || {
            echo "::error::dist/about/index.html has an empty mount point — it is a shell, not a pre-rendered page."
            exit 1
          }

          # Assert on the BUILT HTML, not the components. The canonical bug got
          # past every unit test precisely because it lived in index.html and
          # was applied by the pre-render step — neither of which a React
          # component test looks at. Every page shipped a canonical pointing at
          # the home page, telling crawlers the whole site was one document.
          for page in about azure/education contact; do
            f="dist/$page/index.html"
            n=$(grep -c 'rel="canonical"' "$f" || true)
            [ "$n" -eq 1 ] || { echo "::error::$f has $n canonical links, expected exactly 1."; exit 1; }
            grep -q "rel=\"canonical\" href=\"https://hybridcloudworks.com/$page\"" "$f" || {
              echo "::error::$f canonical is not https://hybridcloudworks.com/$page/ — $(grep -o 'rel="canonical"[^>]*' "$f")"
              exit 1
            }
            grep -q 'property="og:url"' "$f" || { echo "::error::$f has no og:url."; exit 1; }
          done

          # The sitemap is generated from the routes that were written, so a
          # stale hand-maintained file reappearing is a real regression.
          locs=$(grep -c '<loc>' dist/sitemap.xml || echo 0)
          [ "$locs" -ge 60 ] || { echo "::error::sitemap.xml has only $locs URLs — it was not generated from the pre-render route list."; exit 1; }
          grep -q '<loc>https://hybridcloudworks.com/about</loc>' dist/sitemap.xml || {
            echo "::error::sitemap.xml does not use the canonical (non-trailing) form."
            exit 1
          }
          test -f dist/robots.txt || { echo "::error::dist/robots.txt is missing; navigationFallback excludes it, so crawlers get a 404."; exit 1; }
          echo "metadata contract: canonical, og:url and sitemap verified on built HTML"
          bytes=$(du -sb dist | cut -f1)
          echo "dist: $(du -sh dist | cut -f1) ($bytes bytes), limit 524288000"
          [ "$bytes" -lt 524288000 ] || {
            echo "::error::dist is over the Static Web Apps 500 MB limit at $bytes bytes."
            exit 1
          }

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The BUILT OUTPUT, not the app source. `output_location` is an Oryx
          # build-output path and is ignored when the build is skipped, so it
          # cannot narrow what gets uploaded — `app_location` has to be the
          # content root itself.
          app_location: frontend/dist
          skip_app_build: true
          # No skip_api_build here: it is not an input at the pinned action SHA,
          # and with no api_location set there is no API build to skip anyway.
