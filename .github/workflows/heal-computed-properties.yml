# Re-applies the cp_sortDate computed property whenever Terraform could have
# wiped it — and on a schedule, because Terraform applies happen in TF Cloud
# on their own clock, AFTER the push that triggers this workflow. A push-time
# heal can therefore itself be overwritten minutes later; the schedule is what
# guarantees the wound closes. The script is idempotent, so racing an apply is
# harmless — worst case the next tick heals again.
#
# Why the property gets wiped at all: azurerm_cosmosdb_sql_container cannot
# express computedProperties, so any terraform apply that updates the content
# or blogs container PUTs a definition without them (TODO.md T-206;
# scripts/apply-computed-sortdate.mjs header). With PUBLIC_LIST_SQL_ORDER=1
# live, a wiped property breaks the public content list until re-applied —
# which is why this exists as automation rather than a runbook note.
#
# Auth: the OIDC deploy identity, which infra/oidc.tf grants Cosmos Built-in
# Data Contributor scoped to exactly these two containers.
#
# Self-arming: the job is skipped while vars.CLIENT_ID is unset — before the
# first terraform apply there is no identity to log in as, and a red run every
# six hours reads as a permissions bug while actually meaning "not deployed
# yet". Setting CLIENT_ID from the `client_id` Terraform output (the step the
# deploy runbook already requires) arms this workflow automatically; nothing
# needs re-enabling by hand. After arming, a failure is a real signal again —
# most likely the role assignment lagging the identity.

name: Heal Cosmos computed properties

on:
  push:
    branches: [main]
    paths:
      - 'infra/main.tf'
      - 'infra/cosmos-containers.json'
  schedule:
    # Every six hours, offset from the top of the hour.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# id-token: write is what lets the runner request a GitHub OIDC token. Without
# it azure/login has nothing to exchange and fails before reaching Azure.
permissions:
  contents: read
  id-token: write

jobs:
  heal:
    # Skipped until CLIENT_ID is provisioned from the Terraform output — see
    # the self-arming note in the header.
    if: ${{ vars.CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - run: npm ci

      # DefaultAzureCredential resolves through the CLI session azure/login
      # just established. --apply is a no-op when the property is intact.
      - name: Re-apply cp_sortDate if missing
        env:
          # A VARIABLE since 2026-08-20 (it is a public URL; set-github-variables.ps1
          # moved it and deleted the secret). This read `secrets.` until 2026-08-21 and
          # failed with "COSMOS_ENDPOINT is not set" on the first run after the move.
          COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
          # The write is an ARM PUT (control plane), so the script needs to address
          # the account as a resource: subscription + resource group + the account
          # name it derives from the endpoint. Authorized by the custom role in
          # infra/oidc.tf, not by the data-plane grants.
          SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
          COSMOS_RESOURCE_GROUP: ${{ vars.COSMOS_RESOURCE_GROUP }}
        run: node apply-computed-sortdate.mjs --apply
